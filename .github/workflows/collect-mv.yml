name: Collect MV views

# 매일 0시(KST)에 조회수를 기록하고 새 MV를 찾아 목록에 넣는다.
# 기록은 코드와 섞이지 않게 data 브랜치에 쌓는다 (pipeline/mv/daily.ts 참고).
on:
  schedule:
    - cron: '5 15 * * *' # 00:05 KST. Actions가 붐비면 수십 분 늦게 돌 수 있다
    - cron: '5 16 * * *' # 01:05 KST 백업. 첫 실행이 빠졌거나 실패했을 때만 일을 한다 (오늘 기록·검색은 한 번만)
  workflow_dispatch:
    inputs:
      search:
        description: 'MV 검색도 할까요? (100유닛, 오늘 이미 했으면 건너뜀)'
        type: boolean
        default: false
      force_snapshot:
        description: '낮이어도 오늘 조회수를 지금 기록할까요? (오늘 기록이 이미 있으면 건너뜀)'
        type: boolean
        default: false

permissions:
  contents: write # data 브랜치에 커밋
  issues: write # 확인이 필요한 영상·주간 요약 이슈
  actions: write # 새 기록으로 사이트 다시 배포 (deploy.yml 실행)

concurrency:
  group: collect-mv
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: data 브랜치를 .data에 꺼내기 (없으면 새로 만든다)
        run: |
          # 0: 있음, 2: 없음, 그 밖: 네트워크·권한 오류 (없다고 착각해 새로 만들면 안 된다)
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            git fetch -q origin +refs/heads/data:refs/remotes/origin/data
            git worktree add -q -B data .data origin/data
          elif [ "$status" = 2 ]; then
            echo "data 브랜치가 없어 새로 만듭니다"
            git worktree add -q --orphan -b data .data
          else
            echo "::error::data 브랜치를 확인하지 못했습니다 (git ls-remote 종료 코드 $status)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 조회수 기록 + 새 MV 찾기
        run: >-
          npm run mv:collect --
          --data .data
          --issue-out "$RUNNER_TEMP/issue.md"
          --digest-out "$RUNNER_TEMP/digest.md"
          ${{ (github.event_name == 'schedule' || inputs.search) && '--search' || '' }}
          ${{ inputs.force_snapshot && '--force-snapshot' || '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # 수집이 일부 실패해도 받은 만큼은 올리고 이슈를 남긴다 (이 job은 실패로 끝나 메일이 온다)
      - name: data 브랜치에 올리기
        id: push
        if: ${{ !cancelled() }}
        working-directory: .data
        run: bash ../pipeline/mv/push-data.sh

      # GITHUB_TOKEN으로 올린 push는 다른 워크플로를 실행시키지 않아서, 배포를 직접 부른다.
      # 수집이 일부 실패했어도 올린 기록은 사이트에 반영한다
      - name: 사이트 다시 배포
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: 확인이 필요한 것 이슈로 남기기
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          post() {
            local title="$1" body="$2"
            [ -s "$body" ] || return 0
            echo "::group::$title"; cat "$body"; echo "::endgroup::"
            # 같은 날 재실행·백업 실행으로 같은 이슈가 또 생기지 않게 한다
            if [ "$(gh issue list --state all --search "\"$title\" in:title" --json title --jq "map(select(.title == \"$title\")) | length")" != 0 ]; then
              echo "이미 있는 이슈라 건너뜁니다: $title"
              return 0
            fi
            gh issue create --title "$title" --body-file "$body"
          }
          post "MV 수집: 확인이 필요해요 ($today)" "$RUNNER_TEMP/issue.md"
          post "MV 수집: 주간 요약 ($today)" "$RUNNER_TEMP/digest.md"
