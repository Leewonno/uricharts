<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 5 · 연말 결산 — 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..900&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #DCEFE6;
    --green: #0C3B2E;
    --gold: #B8902A;
    --ink: #10221B;
    --paper: #F7FBF8;
    --sage: #557466;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--mint); color: var(--ink); font-family: 'Nanum Gothic', sans-serif; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .serif { font-family: 'Hahmlet', serif; }

  header { max-width: 1200px; margin: 0 auto; padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Hahmlet'; font-weight: 700; font-size: 22px; color: var(--green); }
  nav { display: flex; gap: 24px; font-weight: 700; font-size: 15px; color: var(--sage); }
  nav a[aria-current], nav a:hover { color: var(--green); }

  .hero { max-width: 1200px; margin: 0 auto; padding: 16px 28px 72px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; }
  .year { font-family: 'Hahmlet'; font-weight: 900; font-size: clamp(110px, 17vw, 230px); line-height: .85; color: var(--green); letter-spacing: -6px; }
  .hero-copy { font-family: 'Hahmlet'; font-weight: 400; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.4; margin-top: 18px; max-width: 16em; }
  .hero-copy + p { color: var(--sage); margin-top: 10px; }

  .plaque { background: var(--green); color: var(--paper); border-radius: 28px; padding: 32px; position: relative; }
  .plaque::before { content: ''; position: absolute; inset: 10px; border: 1px solid var(--gold); border-radius: 20px; pointer-events: none; }
  .plaque .cat { color: #D9C27E; font-weight: 700; font-size: 14px; }
  .plaque .mv { aspect-ratio: 16/9; border-radius: 14px; margin: 18px 0; }
  .plaque h2 { font-family: 'Hahmlet'; font-weight: 700; font-size: 38px; line-height: 1.1; }
  .plaque .by { color: #A9C7B9; font-size: 17px; margin-top: 4px; }
  .plaque .stat { display: flex; gap: 28px; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(217,194,126,.35); }
  .plaque .stat dt { font-size: 13px; color: #A9C7B9; }
  .plaque .stat dd { font-family: 'Hahmlet'; font-size: 24px; font-weight: 600; }

  section { max-width: 1200px; margin: 0 auto; padding: 0 28px 72px; }
  .cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .cat-card { background: var(--paper); border-radius: 28px; padding: 28px 28px 20px; }
  .cat-card header { padding: 0; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .cat-card h3 { font-family: 'Hahmlet'; font-weight: 700; font-size: 26px; color: var(--green); }
  .cat-card header span { color: var(--sage); font-size: 14px; }
  .nominee { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid #D3E5DB; align-items: baseline; }
  .nominee .r { font-family: 'Hahmlet'; font-weight: 700; font-size: 22px; color: var(--sage); }
  .nominee:first-of-type .r { color: var(--gold); }
  .nominee .t { font-weight: 700; }
  .nominee .t span { font-weight: 400; color: var(--sage); margin-left: 6px; font-size: 14px; }
  .nominee .v { font-family: 'Hahmlet'; font-weight: 600; }
  .cat-card .all { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--green); border-bottom: 1px solid var(--green); }

  .history { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .history b { font-family: 'Hahmlet'; font-size: 20px; margin-right: 8px; }
  .history a { padding: 8px 18px; border-radius: 999px; border: 1px solid var(--sage); font-family: 'Hahmlet'; font-weight: 600; }
  .history a:hover { background: var(--green); color: var(--paper); border-color: var(--green); }

  footer { max-width: 1200px; margin: 0 auto; padding: 0 28px 40px; color: var(--sage); font-size: 13px; }
  @media (max-width: 900px) {
    .hero, .cats { grid-template-columns: 1fr; }
    .year { letter-spacing: -3px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">올해의 뮤비</a>
  <nav><a href="#" aria-current="page">홈</a><a href="chart.html">차트</a><a href="#">지난 결산</a></nav>
</header>
<main>
  <div class="hero">
    <div>
      <div class="year">2025</div>
      <p class="hero-copy serif">올해 공개된 K-pop 뮤직비디오를 조회수로 결산해요</p>
      <p>주간과 월간 순위도 매주, 매달 새로 발표해요.</p>
    </div>
    <div class="plaque" id="plaque"></div>
  </div>

  <section>
    <div class="cats" id="cats"></div>
  </section>

  <section>
    <div class="history">
      <b>지난 연간 결산</b>
      <a href="#">2024</a><a href="#">2023</a><a href="#">2022</a><a href="#">2021</a>
    </div>
  </section>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, short, date, esc } = KCHART
  const y = ranking('year'), w = y[0]
  document.getElementById('plaque').innerHTML = `
    <div class="cat">현재 2025년 공개 MV 1위</div>
    <div class="mv" style="background:${w.color}"></div>
    <h2>${esc(w.title)}</h2>
    <div class="by">${esc(w.artist)} · ${date(w.released)} 공개</div>
    <dl class="stat">
      <div><dt>누적 조회수</dt><dd>${short(w.views)}</dd></div>
      <div><dt>하루 평균</dt><dd>${short(w.daily)}</dd></div>
      <div><dt>2위와 차이</dt><dd>${short(w.views - y[1].views)}</dd></div>
    </dl>`

  document.getElementById('cats').innerHTML = [['week', '이번 주의 뮤직비디오'], ['month', '이달의 뮤직비디오']].map(([k, name]) => {
    const p = PERIODS[k]
    return `<div class="cat-card">
      <header><h3>${name}</h3><span>${p.label}</span></header>
      ${ranking(k).slice(0, 5).map(m => `
        <div class="nominee"><span class="r">${m.rank}</span>
          <span class="t">${esc(m.title)}<span>${esc(m.artist)}</span></span>
          <span class="v">${short(m.views)}</span></div>`).join('')}
      <a class="all" href="chart.html?p=${k}">${p.name} 차트 전체</a>
    </div>`
  }).join('')
</script>
</body>
</html>
