<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 5 · 연말 결산 — 차트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..900&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --mint: #DCEFE6; --green: #0C3B2E; --gold: #B8902A; --ink: #10221B; --paper: #F7FBF8; --sage: #557466; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--mint); color: var(--ink); font-family: 'Nanum Gothic', sans-serif; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

  header { max-width: 1200px; margin: 0 auto; padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Hahmlet'; font-weight: 700; font-size: 22px; color: var(--green); }
  nav { display: flex; gap: 24px; font-weight: 700; font-size: 15px; color: var(--sage); }
  nav a[aria-current], nav a:hover { color: var(--green); }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 28px 72px; }
  .tabs { display: flex; gap: 10px; }
  .tabs button { font-family: 'Hahmlet'; font-weight: 600; font-size: 18px; padding: 10px 24px; border-radius: 999px; border: 1px solid var(--sage); }
  .tabs button[aria-selected="true"] { background: var(--green); color: var(--paper); border-color: var(--green); }

  .title { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin: 40px 0 36px; }
  h1 { font-family: 'Hahmlet'; font-weight: 800; font-size: clamp(40px, 6vw, 76px); line-height: 1; color: var(--green); letter-spacing: -1.5px; }
  .title p { color: var(--sage); margin-top: 12px; }
  .title select { font: inherit; font-family: 'Hahmlet'; font-weight: 600; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--sage); background: var(--paper); color: var(--green); }

  .top3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
  .medal { background: var(--paper); border-radius: 24px; padding: 22px; display: grid; gap: 10px; }
  .medal:first-child { background: var(--green); color: var(--paper); }
  .medal .n { font-family: 'Hahmlet'; font-weight: 900; font-size: 64px; line-height: .9; color: var(--gold); }
  .medal .mv { aspect-ratio: 16/9; border-radius: 12px; }
  .medal .t { font-family: 'Hahmlet'; font-weight: 700; font-size: 24px; line-height: 1.2; }
  .medal .a { color: var(--sage); }
  .medal:first-child .a, .medal:first-child .v small { color: #A9C7B9; }
  .medal .v { font-family: 'Hahmlet'; font-weight: 600; font-size: 22px; }
  .medal .v small { display: block; font-family: 'Nanum Gothic'; font-weight: 400; font-size: 13px; color: var(--sage); }

  .rest { background: var(--paper); border-radius: 28px; padding: 8px 28px; }
  .line { display: grid; grid-template-columns: 64px 1fr 120px 150px; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid #D3E5DB; }
  .line:first-child { border-top: 0; }
  .line .n { font-family: 'Hahmlet'; font-weight: 700; font-size: 30px; color: var(--sage); }
  .line .t { font-family: 'Hahmlet'; font-weight: 600; font-size: 20px; line-height: 1.25; }
  .line .a { color: var(--sage); font-size: 14px; }
  .line .c { font-size: 14px; color: var(--sage); }
  .line .c.up { color: var(--green); font-weight: 800; }
  .line .c.new { color: var(--gold); font-weight: 800; }
  .line .v { text-align: right; font-family: 'Hahmlet'; font-weight: 600; font-size: 20px; }
  .line .v small { display: block; font-family: 'Nanum Gothic'; font-weight: 400; font-size: 12px; color: var(--sage); }

  footer { max-width: 1200px; margin: 0 auto; padding: 0 28px 40px; color: var(--sage); font-size: 13px; }
  @media (max-width: 860px) {
    .top3 { grid-template-columns: 1fr; }
    .title { grid-template-columns: 1fr; }
    .line { grid-template-columns: 44px 1fr auto; }
    .line .c { display: none; }
    .rest { padding: 4px 18px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="home.html">올해의 뮤비</a>
  <nav><a href="home.html">홈</a><a href="#" aria-current="page">차트</a><a href="#">지난 결산</a></nav>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-p="week">주간</button>
    <button role="tab" data-p="month">월간</button>
    <button role="tab" data-p="year">연간</button>
  </div>
  <div class="title">
    <div><h1 id="h1"></h1><p id="desc"></p></div>
    <select id="sel" aria-label="기간 선택"></select>
  </div>
  <div class="top3" id="top3"></div>
  <div class="rest" id="rest"></div>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, num, short, date, esc } = KCHART
  let period = new URLSearchParams(location.search).get('p') || 'year'
  const opts = { week: ['47주차', '46주차', '45주차'], month: ['10월', '9월', '8월'], year: ['2025년', '2024년', '2023년'] }
  const chg = c => c.kind === 'up' ? `${c.text}계단 상승` : c.kind === 'down' ? `${c.text}계단 하락` : c.kind === 'new' ? '재진입' : c.kind === 'same' ? '변동 없음' : ''

  function render() {
    const p = PERIODS[period]
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === period))
    document.getElementById('h1').textContent = period === 'year' ? '2025년 연간 결산' : `${p.label} ${p.name} 순위`
    document.getElementById('desc').textContent = period === 'year'
      ? '2025년에 공개된 뮤직비디오를 누적 조회수로 순위를 매겼어요. 연말까지 매일 갱신돼요.'
      : `${p.range} 동안 늘어난 조회수 기준이에요.`
    document.getElementById('sel').innerHTML = opts[period].map(o => `<option>${o}</option>`).join('')
    const rows = ranking(period)
    const sub = m => period === 'year' ? `${date(m.released)} 공개` : `누적 ${short(m.total)}`
    document.getElementById('top3').innerHTML = rows.slice(0, 3).map(m => `
      <div class="medal">
        <div class="n">${m.rank}</div>
        <div class="mv" style="background:${m.color}"></div>
        <div><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div></div>
        <div class="v">${num(m.views)}<small>${p.metric} · ${sub(m)}</small></div>
      </div>`).join('')
    document.getElementById('rest').innerHTML = rows.slice(3).map(m => `
      <div class="line">
        <div class="n">${m.rank}</div>
        <div><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div></div>
        <div class="c ${m.change.kind}">${period === 'year' ? `하루 ${short(m.daily)}` : chg(m.change)}</div>
        <div class="v">${short(m.views)}<small>${sub(m)}</small></div>
      </div>`).join('')
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { period = b.dataset.p; render() })
  render()
</script>
</body>
</html>
