<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 — 차트 기간 선택 5종</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme inline {
    --color-page: var(--color-cyan-50);
    --color-surface: var(--color-white);
    --color-fill-soft: var(--color-cyan-100);
    --color-fill: var(--color-cyan-200);
    --color-accent: var(--color-cyan-600);
    --color-muted: var(--color-cyan-700);
    --color-ink: var(--color-cyan-900);
    --color-strong: var(--color-cyan-950);
    --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  @theme {
    --animate-fade-in: fade-in 0.2s ease-out;
    @keyframes fade-in { from { opacity: 0; transform: translateY(-4px); } }
  }
  @layer base {
    body { @apply bg-page text-ink font-sans; line-height: 1.5; word-break: keep-all; }
    :focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; }
  }
</style>
</head>
<body>
  <!-- 시안 고르기 (실제 화면에는 없음) -->
  <div class="sticky top-0 z-40 bg-strong px-4 py-2.5 text-cyan-50">
    <div class="mx-auto flex max-w-[1280px] flex-wrap items-center gap-x-4 gap-y-2">
      <span class="text-sm font-bold">시안</span>
      <div id="variant-tabs" class="flex gap-1"></div>
      <span id="variant-note" class="text-sm font-semibold text-cyan-200"></span>
    </div>
  </div>

  <header class="mx-auto flex w-full max-w-[1280px] items-center px-[clamp(16px,4vw,48px)] py-5">
    <span class="text-xl font-extrabold tracking-[-0.03em] text-strong">URICHARTS</span>
  </header>

  <main class="mx-auto w-full max-w-[1280px] px-[clamp(16px,4vw,48px)] pt-4 pb-16">
    <h1 class="mt-3 mb-6 text-[clamp(28px,3.5vw,40px)] leading-[1.1] font-bold tracking-[-0.04em] text-strong">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="mr-[0.25em] inline-block size-[1.15em] align-[-0.24em]" fill="currentColor"><path d="M23.5 6.5a3 3 0 0 0-2.1-2.1C19.5 4 12 4 12 4s-7.5 0-9.4.4A3 3 0 0 0 .5 6.5 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.5 3 3 0 0 0 2.1 2.1c1.9.4 9.4.4 9.4.4s7.5 0 9.4-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.5ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
      YouTube K-POP MV 조회수
    </h1>

    <!-- 기간 탭 (+ 연간일 때만 오른쪽에 공개연도) -->
    <div class="mb-6 flex flex-wrap items-stretch gap-2">
      <nav aria-label="기간" id="tabs" class="inline-flex gap-1 rounded-full bg-surface p-1.5"></nav>
      <div id="release-slot" class="relative hidden"></div>
    </div>

    <!-- 목록 위 기간 선택 (시안마다 다름) -->
    <div id="picker-area" class="mb-5"></div>

    <div aria-hidden="true" class="grid gap-4 px-5 pb-2 text-[13px] font-semibold text-muted max-md:hidden md:grid-cols-[64px_1fr_170px_72px]">
      <span>순위</span><span>노래</span><span class="text-right">조회수</span><span class="text-center">변동</span>
    </div>
    <ol id="rows" class="grid gap-2"></ol>
  </main>

<script>
const MVS = [{"yt":"bMhDJ0S0OBA","artist":"ILLIT","title":"It's Me","released":"2026-04-30"},{"yt":"_gyultVTesk","artist":"BTS","title":"2.0","released":"2026-04-02"},{"yt":"FyS5dAywkEo","artist":"LISA","title":"SaWaDiKa","released":"2026-09-04"},{"yt":"x3eqqoZPV_E","artist":"BABYMONSTER","title":"CHOOM","released":"2026-05-04"},{"yt":"27C4pfRsf9g","artist":"LE SSERAFIM x ILLIT x KATSEYE","title":"ICONIC BY MISTAKE","released":"2026-06-11"},{"yt":"ekr2nIex040","artist":"ROSÉ & Bruno Mars","title":"APT.","released":"2024-10-18"},{"yt":"b4iVv91Z6lY","artist":"BTS","title":"SWIM","released":"2026-03-20"},{"yt":"BZ4UzthYTss","artist":"Stray Kids","title":"This & That","released":"2026-08-07"},{"yt":"naoGk-Zjc1s","artist":"BABYMONSTER","title":"SUGAR HONEY ICE TEA","released":"2026-06-08"},{"yt":"F7sGJVUrkjQ","artist":"Hearts2Hearts","title":"RUDE!","released":"2026-02-20"},{"yt":"CgCVZdcKcqY","artist":"BLACKPINK","title":"JUMP","released":"2025-07-11"},{"yt":"QERKD90hG98","artist":"TREASURE","title":"IF I","released":"2026-06-01"},{"yt":"JSFG-IE8n_c","artist":"JENNIE","title":"like JENNIE","released":"2025-03-07"},{"yt":"5oQVTnq-UKk","artist":"aespa","title":"Rich Man","released":"2025-09-05"},{"yt":"eHHQaoEW30Q","artist":"TWICE","title":"THIS IS FOR","released":"2025-07-11"},{"yt":"9bZkp7q19f0","artist":"PSY","title":"GANGNAM STYLE","released":"2012-07-15"},{"yt":"IHNzOHi8sJs","artist":"BLACKPINK","title":"DDU-DU DDU-DU","released":"2018-06-15"},{"yt":"gdZLi9oWNZg","artist":"BTS","title":"Dynamite","released":"2020-08-20"},{"yt":"2S24-y0Ij3Y","artist":"BLACKPINK","title":"Kill This Love","released":"2019-04-04"},{"yt":"ioNng23DkIM","artist":"BLACKPINK","title":"How You Like That","released":"2020-06-26"},{"yt":"ASO_zypdnsQ","artist":"PSY","title":"GENTLEMAN","released":"2013-04-13"},{"yt":"gQlMMD8auMs","artist":"BLACKPINK","title":"Pink Venom","released":"2022-08-18"},{"yt":"XsX3ATc3FbA","artist":"BTS","title":"Boy With Luv (feat. Halsey)","released":"2019-04-12"},{"yt":"7C2z4GqqS5E","artist":"BTS","title":"FAKE LOVE","released":"2018-05-18"}]

const VARIANTS = [
  ['제목형', '큰 제목 글자를 누르면 열림 · 설명은 아래'],
  ['화살표형', '‹ › 로 이전/다음 기간을 바로 넘기고, 글자를 누르면 목록'],
  ['문장형', '설명 문장 속 밑줄 글자를 누르면 열림 · 월은 달력처럼 12칸'],
  ['큰 숫자형', '날짜를 큰 숫자로 · 넓은 패널에 칸으로 고르기'],
  ['라벨형', '작은 라벨 + 값 · 설명은 오른쪽 · 목록은 달별로 묶음'],
]

// 오늘 2026-11-24(화). 집계가 끝난 마지막 날은 어제(11-23)
const TODAY = new Date(Date.UTC(2026, 10, 24))
const LAST_DAY = new Date(Date.UTC(2026, 10, 23))
const FIRST_DAY = new Date(Date.UTC(2026, 0, 1))
const FIRST_YEAR = 2026
const PERIODS = [['day', '일간'], ['week', '주간'], ['month', '월간'], ['year', '연간']]
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토']
const RELEASE_YEARS = [...new Set(MVS.map((m) => m.released.slice(0, 4)))].sort().reverse()

const addDays = (d, n) => new Date(d.getTime() + n * 86400000)
const sameDay = (a, b) => a.getTime() === b.getTime()
const md = (d) => `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일`
const mdDot = (d) => `${d.getUTCMonth() + 1}.${d.getUTCDate()}`

function isoWeek(d) {
  const t = new Date(d)
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7))
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1))
  return { year: t.getUTCFullYear(), week: Math.ceil(((t - yearStart) / 86400000 + 1) / 7), thursday: t }
}

// 끝난 주 (월~일, 최근 주부터) — 2026년 1주차까지
const WEEKS = (() => {
  const list = []
  let end = addDays(TODAY, -((TODAY.getUTCDay() + 6) % 7) - 1)
  for (;;) {
    const start = addDays(end, -6)
    const { year, week, thursday } = isoWeek(start)
    if (year < FIRST_YEAR) break
    list.push({ key: `${year}-W${week}`, year, week, start, end, month: thursday.getUTCMonth() + 1 })
    end = addDays(end, -7)
  }
  return list
})()

const MONTHS = (() => {
  const list = []
  for (let m = TODAY.getUTCMonth(); m >= 0; m--) list.push({ key: `2026-${m + 1}`, year: 2026, month: m + 1, partial: m === TODAY.getUTCMonth() })
  return list
})()

const YEARS = (() => {
  const list = []
  for (let y = TODAY.getUTCFullYear(); y >= FIRST_YEAR; y--) list.push({ key: `${y}`, year: y, partial: y === TODAY.getUTCFullYear() })
  return list
})()

const state = {
  variant: 1,
  period: 'day',
  day: LAST_DAY,
  calMonth: new Date(Date.UTC(LAST_DAY.getUTCFullYear(), LAST_DAY.getUTCMonth(), 1)),
  week: WEEKS[0],
  month: MONTHS.find((m) => !m.partial),
  year: YEARS[0],
  release: RELEASE_YEARS[0],
  open: false,
  releaseOpen: false,
}

/* ---------- 글자 ---------- */

const weekLabel = (w) => `${w.year}년 ${w.week}주차`
const weekRange = (w) => `${md(w.start)} ~ ${md(w.end)}`
const dayLabel = (d) => `${d.getUTCFullYear()}년 ${md(d)} (${WEEKDAYS[d.getUTCDay()]})`

function label() {
  switch (state.period) {
    case 'day': return dayLabel(state.day)
    case 'week': return weekLabel(state.week)
    case 'month': return `${state.month.year}년 ${state.month.month}월`
    case 'year': return `${state.year.year}년`
  }
}
const sublabel = () => (state.period === 'week' ? weekRange(state.week) : '')

function releaseYear() {
  switch (state.period) {
    case 'day': return String(state.day.getUTCFullYear())
    case 'week': return String(state.week.year)
    case 'month': return String(state.month.year)
    case 'year': return state.release
  }
}

const periodName = () => PERIODS.find(([k]) => k === state.period)[1]
const partialNote = () =>
  state.period === 'month' && state.month.partial ? ' 이번 달은 아직 집계 중이에요.' : state.period === 'year' && state.year.partial ? ' 올해는 아직 집계 중이에요.' : ''

function describe() {
  if (state.period === 'year') return `${releaseYear()}년에 공개된 K-POP MV의 ${state.year.year}년 조회수 순위예요.${partialNote()}`
  return `${releaseYear()}년에 공개된 K-POP MV ${periodName()} 조회수 순위예요.${partialNote()}`
}

/* ---------- 이전/다음 기간 ---------- */

function step(dir) {
  // dir: -1 이전, +1 다음
  switch (state.period) {
    case 'day': {
      const next = addDays(state.day, dir)
      if (next >= FIRST_DAY && next <= LAST_DAY) state.day = next
      break
    }
    case 'week': { const i = WEEKS.indexOf(state.week) - dir; if (WEEKS[i]) state.week = WEEKS[i]; break }
    case 'month': { const i = MONTHS.indexOf(state.month) - dir; if (MONTHS[i]) state.month = MONTHS[i]; break }
    case 'year': { const i = YEARS.indexOf(state.year) - dir; if (YEARS[i]) state.year = YEARS[i]; break }
  }
}
function canStep(dir) {
  switch (state.period) {
    case 'day': { const n = addDays(state.day, dir); return n >= FIRST_DAY && n <= LAST_DAY }
    case 'week': return !!WEEKS[WEEKS.indexOf(state.week) - dir]
    case 'month': return !!MONTHS[MONTHS.indexOf(state.month) - dir]
    case 'year': return !!YEARS[YEARS.indexOf(state.year) - dir]
  }
}

/* ---------- 아이콘 ---------- */

const icon = (path, cls = 'size-5') =>
  `<svg aria-hidden="true" viewBox="0 0 24 24" class="${cls} shrink-0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`
const CHEVRON_DOWN = 'm4 9 8 8 8-8'
const CHEVRON_LEFT = 'm15 4-8 8 8 8'
const CHEVRON_RIGHT = 'm9 4 8 8-8 8'
const chevron = (cls = 'size-5') => icon(CHEVRON_DOWN, `${cls} transition-transform duration-200 ${state.open ? 'rotate-180' : ''}`)

/* ---------- 팝업 내용 ---------- */

const CARD = 'rounded-3xl bg-surface shadow-lg shadow-cyan-900/10'

function listItem(attr, selected, main, sub = '') {
  const tone = selected ? 'bg-fill text-ink' : 'text-muted hover:bg-fill-soft hover:text-ink cursor-pointer'
  return `<li ${attr} class="flex items-baseline justify-between gap-6 rounded-full px-5 py-2 text-[17px] font-bold whitespace-nowrap ${tone}" ${selected ? 'data-picked' : ''}>
    <span>${main}</span>${sub ? `<span class="text-sm font-semibold ${selected ? 'text-ink/70' : 'text-muted/80'}">${sub}</span>` : ''}</li>`
}

// 단순 목록 (최근부터)
function plainList() {
  const items = {
    week: () => WEEKS.map((w) => listItem(`data-week="${w.key}"`, w === state.week, weekLabel(w), weekRange(w))),
    month: () => MONTHS.map((m) => listItem(`data-month="${m.key}"`, m === state.month, `${m.year}년 ${m.month}월`, m.partial ? '집계 중' : '')),
    year: () => YEARS.map((y) => listItem(`data-year="${y.key}"`, y === state.year, `${y.year}년`, y.partial ? '집계 중' : '')),
  }[state.period]()
  return `<ul class="${CARD} grid max-h-80 min-w-64 gap-0.5 overflow-y-auto p-1.5">${items.join('')}</ul>`
}

// 주를 달별로 묶은 목록 (달 이름이 위에 붙어 있음)
function groupedWeekList() {
  const groups = []
  for (const w of WEEKS) {
    const last = groups.at(-1)
    if (last?.month === w.month) last.weeks.push(w)
    else groups.push({ month: w.month, weeks: [w] })
  }
  return `<div class="${CARD} max-h-96 w-80 overflow-y-auto p-1.5">${groups.map((g) => `
    <div class="sticky top-0 z-10 bg-surface/95 px-5 pt-2 pb-1 text-xs font-bold text-muted backdrop-blur">2026년 ${g.month}월</div>
    <ul class="grid gap-0.5">${g.weeks.map((w) => listItem(`data-week="${w.key}"`, w === state.week, `${w.week}주차`, `${mdDot(w.start)} ~ ${mdDot(w.end)}`)).join('')}</ul>`).join('')}
  </div>`
}

// 칸으로 고르기 (월: 12칸, 주: 칩, 연: 칩)
function cell(attr, selected, main, sub = '', disabled = false) {
  const tone = disabled ? 'text-muted/30' : selected ? 'bg-fill text-ink' : 'text-ink hover:bg-fill-soft cursor-pointer'
  return `<button type="button" ${disabled ? 'disabled' : attr} ${selected ? 'data-picked' : ''}
    class="grid place-items-center gap-0.5 rounded-2xl px-2 py-3 font-bold ${tone}">
    <span class="text-[17px]">${main}</span>${sub ? `<span class="text-xs font-semibold ${disabled ? '' : 'text-muted'}">${sub}</span>` : ''}</button>`
}

function monthGrid() {
  const cells = []
  for (let m = 1; m <= 12; m++) {
    const mo = MONTHS.find((x) => x.month === m)
    cells.push(cell(`data-month="2026-${m}"`, mo === state.month, `${m}월`, mo?.partial ? '집계 중' : '', !mo))
  }
  return `<div class="${CARD} w-[316px] p-4">
    <div class="mb-3 flex items-center justify-between">
      <span class="grid size-9 place-items-center text-muted/30">${icon(CHEVRON_LEFT, 'size-4')}</span>
      <span class="text-[17px] font-bold text-strong">2026년</span>
      <span class="grid size-9 place-items-center text-muted/30">${icon(CHEVRON_RIGHT, 'size-4')}</span>
    </div>
    <div class="grid grid-cols-4 gap-1">${cells.join('')}</div>
  </div>`
}

function weekChips() {
  return `<div class="grid max-h-96 grid-cols-4 gap-1 overflow-y-auto">${WEEKS.map((w) =>
    cell(`data-week="${w.key}"`, w === state.week, `${w.week}주차`, `${mdDot(w.start)}~${mdDot(w.end)}`)).join('')}</div>`
}

function calendar({ big = false, latestButton = false } = {}) {
  const first = state.calMonth
  const y = first.getUTCFullYear(), m = first.getUTCMonth()
  const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate()
  const canPrev = !(y === FIRST_YEAR && m === 0)
  const canNext = new Date(Date.UTC(y, m + 1, 1)) <= LAST_DAY
  const size = big ? 'size-12 text-base' : 'size-10 text-[15px]'
  const cells = Array.from({ length: first.getUTCDay() }, () => '<span></span>')
  for (let d = 1; d <= days; d++) {
    const date = new Date(Date.UTC(y, m, d))
    const disabled = date > LAST_DAY
    const selected = sameDay(date, state.day)
    const tone = selected ? 'bg-fill text-ink' : disabled ? 'text-muted/30' : `${date.getUTCDay() === 0 ? 'text-pink-600' : 'text-ink'} hover:bg-fill-soft cursor-pointer`
    cells.push(`<button type="button" ${disabled ? 'disabled' : `data-day="${date.toISOString()}"`}
      class="relative grid ${size} place-items-center rounded-full font-semibold tabular-nums ${tone}">${d}${sameDay(date, TODAY) ? '<span class="absolute bottom-1 size-1 rounded-full bg-accent"></span>' : ''}</button>`)
  }
  const arrow = (dir, enabled, path) => `<button type="button" ${enabled ? `data-cal="${dir}"` : 'disabled'} aria-label="${dir < 0 ? '이전 달' : '다음 달'}"
    class="grid size-9 place-items-center rounded-full ${enabled ? 'cursor-pointer text-ink hover:bg-fill-soft' : 'text-muted/30'}">${icon(path, 'size-4')}</button>`
  return `<div>
    <div class="mb-2 flex items-center justify-between">
      ${arrow(-1, canPrev, CHEVRON_LEFT)}
      <span class="text-[17px] font-bold text-strong">${y}년 ${m + 1}월</span>
      ${arrow(1, canNext, CHEVRON_RIGHT)}
    </div>
    <div class="grid grid-cols-7 justify-items-center gap-y-0.5 text-xs font-semibold text-muted">
      ${WEEKDAYS.map((w, i) => `<span class="grid h-7 place-items-center ${i === 0 ? 'text-pink-600' : ''}">${w}</span>`).join('')}
      ${cells.join('')}
    </div>
    ${latestButton
      ? `<button type="button" data-latest class="mt-2 w-full cursor-pointer rounded-full py-2 text-sm font-bold text-accent hover:bg-fill-soft">가장 최근 날짜로 (${md(LAST_DAY)})</button>`
      : `<p class="mt-2 text-center text-xs font-semibold text-muted">오늘(${md(TODAY)})은 내일 집계돼요</p>`}
  </div>`
}

const calendarCard = (opts) => `<div class="${CARD} w-[316px] p-4">${calendar(opts)}</div>`

/* ---------- 시안별 기간 선택 ---------- */

// 공통: 누르면 열리는 글자 버튼
const trigger = (inner, cls) =>
  `<button id="picker-btn" type="button" aria-haspopup="dialog" aria-expanded="${state.open}" class="group inline-flex cursor-pointer items-center ${cls}">${inner}</button>`
const pop = (inner, cls = '') => (state.open ? `<div class="absolute top-full left-0 z-20 mt-2 animate-fade-in ${cls}">${inner}</div>` : '')

const PICKERS = {
  // 1. 제목형
  1() {
    const sub = sublabel() ? ` <span class="text-[0.7em] font-semibold text-muted">${sublabel()}</span>` : ''
    const panel = state.period === 'day' ? calendarCard() : plainList()
    return `<div class="relative inline-block" id="picker-root">
        ${trigger(`<span>${label()}${sub}</span>${chevron()}`, 'gap-2 text-[26px] leading-tight font-bold tracking-[-0.03em] text-strong transition-colors hover:text-accent aria-expanded:text-accent max-md:text-[22px]')}
        ${pop(panel)}
      </div>
      <p class="mt-1 text-[15px] font-semibold text-muted">${describe()}</p>`
  },

  // 2. 화살표형
  2() {
    const arrow = (dir, path) => `<button type="button" ${canStep(dir) ? `data-step="${dir}"` : 'disabled'} aria-label="${dir < 0 ? '이전' : '다음'} ${periodName()}"
      class="grid size-10 place-items-center rounded-full ${canStep(dir) ? 'cursor-pointer text-strong hover:text-accent' : 'text-muted/25'}">${icon(path, 'size-6')}</button>`
    const panel = state.period === 'day' ? calendarCard() : plainList()
    return `<div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <div class="-ml-2 flex items-center">
          ${arrow(-1, CHEVRON_LEFT)}
          <div class="relative" id="picker-root">
            ${trigger(`<span>${label()}</span>`, 'px-1 text-[26px] leading-tight font-bold tracking-[-0.03em] text-strong underline-offset-[6px] hover:underline decoration-fill decoration-[3px] aria-expanded:text-accent max-md:text-[22px]')}
            ${pop(panel)}
          </div>
          ${arrow(1, CHEVRON_RIGHT)}
        </div>
        ${sublabel() ? `<span class="text-[15px] font-semibold text-muted">${sublabel()}</span>` : ''}
      </div>
      <p class="mt-1 text-[15px] font-semibold text-muted">${describe()}</p>`
  },

  // 3. 문장형
  3() {
    const panel = { day: () => calendarCard(), week: groupedWeekList, month: monthGrid, year: plainList }[state.period]()
    const what = state.period === 'year' ? `${releaseYear()}년에 공개된 K-POP MV의 조회수 순위예요.` : `${releaseYear()}년에 공개된 K-POP MV ${periodName()} 조회수 순위예요.`
    const sub = sublabel() ? ` <span class="font-semibold text-muted">(${sublabel()})</span>` : ''
    return `<div class="text-xl leading-relaxed font-bold text-ink max-md:text-lg">
        <span class="relative inline-block" id="picker-root">
          ${trigger(`<span class="underline decoration-accent decoration-dotted decoration-2 underline-offset-[6px]">${label()}</span>${chevron('size-4')}`, 'gap-1 text-strong hover:text-accent aria-expanded:text-accent')}
          ${pop(panel)}
        </span>${sub} 기준, ${what}${partialNote()}
      </div>`
  },

  // 4. 큰 숫자형
  4() {
    const d = state.day
    const [big, top, bottom] = {
      day: () => [`${d.getUTCMonth() + 1}.${String(d.getUTCDate()).padStart(2, '0')}`, `${d.getUTCFullYear()}년`, `${WEEKDAYS[d.getUTCDay()]}요일`],
      week: () => [`${state.week.week}주차`, `${state.week.year}년`, `${mdDot(state.week.start)} ~ ${mdDot(state.week.end)}`],
      month: () => [`${state.month.month}월`, `${state.month.year}년`, state.month.partial ? '집계 중' : '한 달'],
      year: () => [`${state.year.year}`, '연간', state.year.partial ? '집계 중' : '한 해'],
    }[state.period]()
    const panel = {
      day: () => `<div class="${CARD} w-[400px] p-5">${calendar({ big: true })}</div>`,
      week: () => `<div class="${CARD} w-[560px] p-4 max-md:w-[calc(100vw-32px)]"><p class="mb-2 px-2 text-sm font-bold text-muted">2026년 주차</p>${weekChips()}</div>`,
      month: monthGrid,
      year: () => `<div class="${CARD} w-[316px] p-4"><div class="grid grid-cols-3 gap-1">${YEARS.map((y) => cell(`data-year="${y.key}"`, y === state.year, `${y.year}`, y.partial ? '집계 중' : '')).join('')}</div></div>`,
    }[state.period]()
    return `<div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2">
        <div class="relative" id="picker-root">
          ${trigger(`
            <span class="text-[56px] leading-none font-extrabold tracking-[-0.05em] text-strong tabular-nums group-hover:text-accent group-aria-expanded:text-accent max-md:text-[44px]">${big}</span>
            <span class="ml-3 grid text-left leading-tight">
              <span class="text-[15px] font-bold text-muted">${top}</span>
              <span class="flex items-center gap-1 text-[15px] font-bold text-ink">${bottom}${chevron('size-4')}</span>
            </span>`, 'items-end')}
          ${pop(panel)}
        </div>
        <p class="pb-1 text-[15px] font-semibold text-muted">${describe()}</p>
      </div>`
  },

  // 5. 라벨형
  5() {
    const name = { day: '날짜', week: '주', month: '달', year: '해' }[state.period]
    const panel = { day: () => calendarCard({ latestButton: true }), week: groupedWeekList, month: plainList, year: plainList }[state.period]()
    const sub = sublabel() ? ` <span class="font-semibold text-muted">${sublabel()}</span>` : ''
    return `<div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2 border-b-2 border-fill pb-3">
        <div class="relative" id="picker-root">
          <p class="mb-0.5 text-[13px] font-bold text-muted">${periodName()} 차트 · ${name} 고르기</p>
          ${trigger(`<span>${label()}${sub}</span>${chevron('size-[18px]')}`, 'gap-2 text-[22px] leading-tight font-bold tracking-[-0.02em] text-strong hover:text-accent aria-expanded:text-accent')}
          ${pop(panel)}
        </div>
        <p class="text-[15px] font-semibold text-muted">${describe()}</p>
      </div>`
  },
}

/* ---------- 나머지 화면 ---------- */

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) } return h >>> 0 }
const selectionKey = () => state.period + ':' + ({ day: state.day.toISOString(), week: state.week.key, month: state.month.key, year: state.year.key })[state.period]
const SCALE = { day: 1_200_000, week: 7_000_000, month: 28_000_000, year: 260_000_000 }

function rows() {
  const key = selectionKey() + releaseYear()
  return MVS.filter((m) => m.released.startsWith(releaseYear()))
    .map((m) => ({ ...m, views: Math.round(SCALE[state.period] * (0.15 + (hash(key + m.yt) % 1000) / 1000)), prev: hash('prev' + key + m.yt) % 12 }))
    .sort((a, b) => b.views - a.views)
    .map((m, i) => ({ ...m, rank: i + 1 }))
}

function changeBadge(m) {
  if (state.period === 'year') return ''
  const d = m.prev - m.rank
  if (m.prev === 0) return '<span class="text-pink-600">재진입</span>'
  if (d > 0) return `<span class="text-accent">▲${d}</span>`
  if (d < 0) return `<span class="text-muted">▼${-d}</span>`
  return '<span class="text-muted">–</span>'
}

function renderVariantTabs() {
  document.getElementById('variant-tabs').innerHTML = VARIANTS.map(([name], i) => `
    <button type="button" data-variant="${i + 1}" class="cursor-pointer rounded-full px-3 py-1 text-sm font-bold ${state.variant === i + 1 ? 'bg-cyan-200 text-strong' : 'text-cyan-100 hover:bg-cyan-900'}">${i + 1}. ${name}</button>`).join('')
  document.getElementById('variant-note').textContent = VARIANTS[state.variant - 1][1]
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = PERIODS.map(([k, name]) => `
    <button type="button" data-period="${k}" ${k === state.period ? 'aria-current="page"' : ''}
      class="cursor-pointer rounded-full px-[26px] py-2 text-lg font-bold text-muted aria-[current=page]:bg-fill aria-[current=page]:text-ink max-md:px-[18px] max-md:text-base">${name}</button>`).join('')

  const slot = document.getElementById('release-slot')
  slot.classList.toggle('hidden', state.period !== 'year')
  slot.classList.toggle('grid', state.period === 'year')
  slot.innerHTML = `
    <button type="button" id="release-btn" aria-label="공개 연도" aria-expanded="${state.releaseOpen}"
      class="flex cursor-pointer items-center gap-3 rounded-full bg-surface pr-5 pl-6 text-lg font-bold text-ink transition-colors duration-200 hover:bg-fill-soft aria-expanded:bg-fill-soft max-md:pr-4 max-md:pl-5 max-md:text-base">
      ${state.release}년 공개
      ${icon(CHEVRON_DOWN, `size-[15px] transition-transform duration-200 ${state.releaseOpen ? 'rotate-180' : ''}`)}
    </button>
    ${state.releaseOpen ? `
    <ul class="${CARD} absolute top-full left-0 z-20 mt-2 grid max-h-72 min-w-full animate-fade-in gap-0.5 overflow-y-auto p-1.5">
      ${RELEASE_YEARS.map((y) => `<li data-release="${y}" class="cursor-pointer rounded-full px-5 py-2 text-lg font-bold whitespace-nowrap max-md:text-base ${y === state.release ? 'bg-fill text-ink' : 'text-muted hover:bg-fill-soft hover:text-ink'}">${y}년 공개</li>`).join('')}
    </ul>` : ''}`
}

function renderPicker() {
  const area = document.getElementById('picker-area')
  area.innerHTML = PICKERS[state.variant]()
  // 목록이 길면 고른 항목이 보이게 (페이지는 움직이지 않고 목록 안에서만)
  const picked = area.querySelector('[data-picked]')
  const scroller = picked?.closest('.overflow-y-auto')
  if (picked && scroller) scroller.scrollTop = picked.offsetTop - scroller.offsetTop - scroller.clientHeight / 2
}

function renderRows() {
  const list = rows()
  const max = Math.max(list[0]?.views ?? 1, 1)
  document.getElementById('rows').innerHTML = list.map((m) => `
    <li><div class="relative grid grid-cols-[40px_1fr_auto] items-center gap-3 overflow-hidden rounded-[14px] bg-surface px-5 py-3.5 transition-colors duration-200 hover:bg-fill-soft md:grid-cols-[64px_1fr_170px_72px] md:gap-4">
      <div aria-hidden="true" class="absolute inset-y-0 left-0 bg-linear-to-r from-fill/50 to-transparent" style="width:${(m.views / max) * 100}%"></div>
      <div class="relative text-[26px] leading-none font-semibold tabular-nums max-sm:text-xl">${m.rank}</div>
      <div class="relative flex min-w-0 items-center gap-3.5">
        <img src="https://i.ytimg.com/vi/${m.yt}/mqdefault.jpg" alt="" class="aspect-video w-16 rounded-lg bg-fill-soft object-cover max-sm:hidden md:w-24" />
        <div class="min-w-0"><div class="truncate text-[17px] font-bold">${m.title}</div><div class="truncate text-sm text-muted">${m.artist}</div></div>
      </div>
      <div class="relative text-right text-xl font-semibold tracking-[-0.04em] tabular-nums max-sm:text-[15px]">${m.views.toLocaleString('ko-KR')}</div>
      <div class="relative text-center text-sm font-bold max-md:hidden">${changeBadge(m)}</div>
    </div></li>`).join('')
}

function render() { renderVariantTabs(); renderTabs(); renderPicker(); renderRows() }

const syncCalMonth = () => { state.calMonth = new Date(Date.UTC(state.day.getUTCFullYear(), state.day.getUTCMonth(), 1)) }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-variant],[data-period],[data-release],#release-btn,#picker-btn,[data-step],[data-cal],[data-day],[data-week],[data-month],[data-year],[data-latest]')
  if (!e.target.closest('#picker-root')) state.open = false
  if (!e.target.closest('#release-slot')) state.releaseOpen = false
  if (!t) return render()

  const d = t.dataset
  if (d.variant) { state.variant = Number(d.variant); history.replaceState(null, '', `?v=${d.variant}`) }
  else if (d.period) { state.period = d.period; state.open = false }
  else if (t.id === 'release-btn') state.releaseOpen = !state.releaseOpen
  else if (d.release) { state.release = d.release; state.releaseOpen = false }
  else if (t.id === 'picker-btn') { state.open = !state.open; syncCalMonth() }
  else if (d.step) { step(Number(d.step)); state.open = false }
  else if (d.cal) state.calMonth = new Date(Date.UTC(state.calMonth.getUTCFullYear(), state.calMonth.getUTCMonth() + Number(d.cal), 1))
  else if (d.day) { state.day = new Date(d.day); state.open = false }
  else if (d.latest) { state.day = LAST_DAY; state.open = false }
  else if (d.week) { state.week = WEEKS.find((w) => w.key === d.week); state.open = false }
  else if (d.month) { state.month = MONTHS.find((m) => m.key === d.month); state.open = false }
  else if (d.year) { state.year = YEARS.find((y) => y.key === d.year); state.open = false }
  render()
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { state.open = false; state.releaseOpen = false; render() } })

// 주소로 상태 지정: ?v=3&period=month&open=1
const params = new URLSearchParams(location.search)
if (Number(params.get('v')) >= 1 && Number(params.get('v')) <= VARIANTS.length) state.variant = Number(params.get('v'))
if (PERIODS.some(([k]) => k === params.get('period'))) state.period = params.get('period')
if (params.get('open') === '1') state.open = true

render()
</script>
</body>
</html>
