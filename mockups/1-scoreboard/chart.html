<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리의차트 URICHARTS —차트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #5D5499;        /* 차분한 라벤더 바이올렛 */
    --panel: #463E80;
    --panel-hover: #524A91;
    --lav: #DCD3FF;       /* 포인트: 옅은 라벤더 */
    --ink: #2F2861;       /* 라벤더 위 글자색 */
    --dim: #BEB3EE;
    --pink: #F3B6D6;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--bg); color: var(--white); font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--lav); outline-offset: 3px; }
  .num { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 20px clamp(16px, 4vw, 48px); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.04em; }
  .logo i { display: flex; align-items: end; gap: 3px; height: 32px; }
  .logo i b { width: 6px; border-radius: 2px; background: var(--lav); }
  .logo .name { display: flex; flex-direction: column; line-height: 1.1; }
  .logo .name small { font-size: 10.5px; font-weight: 700; letter-spacing: 0.2em; color: var(--dim); margin-top: 3px; }
  nav { display: flex; gap: 6px; }
  nav a { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; }
  nav a:hover, nav a[aria-current] { background: var(--panel); }

  main { max-width: 1280px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 48px) 64px; }
  .tabs { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 6px; gap: 4px; }
  .tabs button { font-weight: 800; font-size: 18px; padding: 8px 26px; border-radius: 999px; color: var(--dim); }
  .tabs button[aria-selected="true"] { background: var(--lav); color: var(--ink); }

  .title-row { display: flex; justify-content: space-between; align-items: end; margin: 28px 0 20px; gap: 16px; flex-wrap: wrap; }
  .title-row h1 { font-weight: 900; font-size: clamp(36px, 5.5vw, 64px); line-height: 1.05; letter-spacing: -0.04em; }
  .title-row p { color: var(--dim); margin-top: 8px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); font-size: 18px; }
  .chips { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .chips button { padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--panel); font-weight: 700; font-size: 14px; color: var(--dim); }
  .chips button[aria-pressed="true"] { background: var(--white); color: var(--ink); border-color: var(--white); }

  .head, .row { display: grid; grid-template-columns: 64px 56px 1fr 170px 110px 100px; gap: 16px; align-items: center; }
  .head { padding: 0 20px 8px; color: var(--dim); font-size: 13px; font-weight: 600; }
  .head .r { text-align: right; }
  .list { display: grid; gap: 8px; }

  .row { background: var(--panel); border-radius: 14px; padding: 14px 20px; position: relative; overflow: hidden; transition: background .2s; }
  .row > * { position: relative; }
  .row .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(220,211,255,.16), rgba(220,211,255,.03)); }
  .row:hover, .row:focus-visible { background: var(--panel-hover); }
  .row.lead { background: var(--lav); color: var(--ink); }
  .row.lead .fill { display: none; }
  .row.lead .a, .row.lead .sub, .row.lead .chg { color: #5A519A; }

  .rank { font-size: 32px; line-height: 1; font-weight: 900; }
  .chg { font-weight: 700; font-size: 14px; }
  .chg.up { color: var(--lav); } .chg.down, .chg.same { color: var(--dim); } .chg.new { color: var(--pink); }
  .song { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .thumb { width: 96px; aspect-ratio: 16/9; border-radius: 8px; flex-shrink: 0; }
  .t { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { color: var(--dim); font-size: 14px; }
  .v { text-align: right; font-size: 21px; }
  .sub { text-align: right; color: var(--dim); font-size: 13px; }

  /* 호버 시: >>> 가 오른쪽으로 달려가고, 끝에 > 보러가기 버튼이 나타남 */
  .go { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .trail { position: relative; width: 52px; height: 20px; overflow: hidden; color: var(--lav); }
  .trail svg { position: absolute; left: 0; top: 2px; width: 10px; height: 16px; opacity: 0; }
  .row:hover .trail svg, .row:focus-visible .trail svg { animation: race .8s cubic-bezier(.3, 0, .7, 1) infinite; }
  .trail svg:nth-child(2) { animation-delay: .16s !important; }
  .trail svg:nth-child(3) { animation-delay: .32s !important; }
  @keyframes race {
    0%   { transform: translateX(-10px); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translateX(52px); opacity: 0; }
  }
  .icon { width: 38px; height: 38px; border-radius: 50%; background: var(--lav); color: var(--ink); display: grid; place-items: center; flex-shrink: 0;
          opacity: 0; transform: translateX(-14px) scale(.85); transition: opacity .2s, transform .25s cubic-bezier(.2, .9, .3, 1.3); }
  .icon svg { width: 10px; height: 16px; margin-left: 2px; }
  .row:hover .icon, .row:focus-visible .icon { opacity: 1; transform: none; }
  .row.lead .trail { color: var(--ink); }
  .row.lead .icon { background: var(--ink); color: var(--lav); }

  @media (hover: none) {
    .trail { display: none; }
    .icon { opacity: 1; transform: none; width: 32px; height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .trail { display: none; }
    .icon { transition: none; }
  }

  footer { text-align: center; padding: 32px; color: var(--dim); font-size: 13px; }
  @media (max-width: 860px) {
    .head { display: none; }
    .row { grid-template-columns: 40px 1fr auto auto; gap: 12px; }
    .row .chg, .row .sub { display: none; }
    .thumb { width: 64px; }
    .trail { display: none; }
    .tabs button { padding: 8px 18px; font-size: 16px; }
  }
  @media (max-width: 560px) {
    .v { font-size: 16px; }
    .rank { font-size: 24px; }
    .thumb { display: none; }
    nav a { padding: 8px 10px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="home.html"><i aria-hidden="true"><b style="height:14px"></b><b style="height:32px"></b><b style="height:22px"></b></i><span class="name">우리의차트<small>URICHARTS</small></span></a>
  <nav><a href="home.html">홈</a><a href="#" aria-current="page">차트</a><a href="#">소개</a></nav>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-p="week">주간</button>
    <button role="tab" data-p="month">월간</button>
    <button role="tab" data-p="year">연간</button>
  </div>
  <div class="title-row">
    <div><h1 id="label"></h1><p id="range"></p></div>
    <div class="stepper"><button aria-label="이전 기간">‹</button><button aria-label="다음 기간">›</button></div>
  </div>
  <div class="chips" id="chips">
    <button aria-pressed="true" data-t="">전체</button>
    <button aria-pressed="false" data-t="걸그룹">걸그룹</button>
    <button aria-pressed="false" data-t="보이그룹">보이그룹</button>
    <button aria-pressed="false" data-t="솔로">솔로</button>
  </div>
  <div class="head"><span>순위</span><span>변동</span><span>뮤직비디오</span><span class="r" id="metric"></span><span class="r">누적</span><span></span></div>
  <div class="list" id="list"></div>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, num, short, esc } = KCHART
  let period = new URLSearchParams(location.search).get('p') || 'week'
  let type = ''

  const CHEVRON = '<svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  // 실제 서비스에서는 수집한 videoId로 https://www.youtube.com/watch?v=... 링크를 만듭니다
  const watchUrl = m => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${m.artist} ${m.title} MV`)

  function render() {
    const p = PERIODS[period]
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === period))
    document.getElementById('label').textContent = `${p.label} ${p.name} 차트`
    document.getElementById('range').textContent = p.range
    document.getElementById('metric').textContent = p.metric
    const rows = ranking(period).filter(m => !type || m.type === type)
    const max = rows[0]?.views || 1
    document.getElementById('list').innerHTML = rows.map((m, i) => `
      <a class="row ${i === 0 ? 'lead' : ''}" href="${watchUrl(m)}" target="_blank" rel="noopener"
         aria-label="${esc(m.artist)} ${esc(m.title)} 뮤직비디오 유튜브에서 보기">
        <div class="fill" style="width:${(m.views / max) * 100}%"></div>
        <div class="rank num">${m.rank}</div>
        <div class="chg ${m.change.kind}">${m.change.kind === 'up' ? '▲' : m.change.kind === 'down' ? '▼' : ''}${m.change.text}</div>
        <div class="song"><div class="thumb" style="background:${m.color}"></div>
          <div style="min-width:0"><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div></div></div>
        <div class="v num">${num(m.views)}</div>
        <div class="sub">${period === 'year' ? `하루 평균 ${short(m.daily)}` : short(m.total)}</div>
        <div class="go" aria-hidden="true"><span class="trail">${CHEVRON.repeat(3)}</span><span class="icon">${CHEVRON}</span></div>
      </a>`).join('')
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { period = b.dataset.p; render() })
  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => {
    type = b.dataset.t
    document.querySelectorAll('#chips button').forEach(x => x.setAttribute('aria-pressed', x === b))
    render()
  })
  render()
</script>
</body>
</html>
