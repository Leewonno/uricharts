<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리의차트 URICHARTS —K-pop 뮤직비디오 조회수 차트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #5D5499;
    --panel: #463E80;
    --panel-hover: #524A91;
    --lav: #DCD3FF;
    --ink: #2F2861;
    --dim: #BEB3EE;
    --pink: #F3B6D6;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--bg); color: var(--white); font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--lav); outline-offset: 3px; }
  .num { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 20px clamp(16px, 4vw, 48px); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.04em; }
  .logo i { display: flex; align-items: end; gap: 3px; height: 32px; }
  .logo i b { width: 6px; border-radius: 2px; background: var(--lav); }
  .logo .name { display: flex; flex-direction: column; line-height: 1.1; }
  .logo .name small { font-size: 10.5px; font-weight: 700; letter-spacing: 0.2em; color: var(--dim); margin-top: 3px; }
  nav { display: flex; gap: 6px; }
  nav a { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; }
  nav a:hover, nav a[aria-current] { background: var(--panel); }

  .hero { padding: 24px clamp(16px, 4vw, 48px) 56px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: end; max-width: 1280px; margin: 0 auto; }
  .hero-week { font-weight: 700; color: var(--lav); font-size: 17px; }
  .hero h1 { font-weight: 900; font-size: clamp(56px, 9vw, 120px); line-height: 0.95; letter-spacing: -0.05em; margin: 10px 0 22px; }
  .winner { display: flex; gap: 20px; align-items: center; }
  .thumb { width: 168px; aspect-ratio: 16/9; border-radius: 10px; flex-shrink: 0; position: relative; overflow: hidden; }
  .thumb::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 70% 30%, rgba(255,255,255,.4), transparent 60%); }
  .winner .title { font-size: 24px; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; }
  .winner .artist { color: var(--dim); font-size: 15px; }

  .counter { background: var(--panel); border-radius: 20px; padding: 28px 28px 24px; }
  .counter .label { color: var(--dim); font-weight: 600; }
  .counter .big { font-size: clamp(44px, 6vw, 80px); line-height: 1; font-weight: 900; color: var(--lav); margin: 8px 0 16px; letter-spacing: -0.03em; }
  .counter .row { display: flex; justify-content: space-between; border-top: 1px solid rgba(220,211,255,.18); padding-top: 12px; font-size: 15px; color: var(--dim); }
  .counter .row b { color: var(--white); }

  section { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 56px; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .sec-head h2 { font-weight: 800; font-size: 28px; letter-spacing: -0.03em; }
  .sec-head a { font-weight: 700; color: var(--lav); }
  .sec-head a:hover { text-decoration: underline; text-underline-offset: 4px; }

  .board { display: grid; gap: 8px; }
  .row-item { display: grid; grid-template-columns: 56px 1fr 120px 56px 100px; align-items: center; gap: 16px; background: var(--panel); border-radius: 12px; padding: 12px 20px; position: relative; overflow: hidden; transition: background .2s; }
  .row-item:hover, .row-item:focus-visible { background: var(--panel-hover); }
  .row-item .bar { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(220,211,255,.12); }
  .row-item > * { position: relative; }
  .row-item .rank { font-size: 28px; font-weight: 900; }
  .row-item .t { font-weight: 700; font-size: 17px; }
  .row-item .a { color: var(--dim); font-size: 14px; }
  .row-item .v { text-align: right; font-size: 19px; }
  .chg { text-align: right; font-weight: 700; font-size: 14px; }
  .chg.up { color: var(--lav); } .chg.down, .chg.same { color: var(--dim); } .chg.new { color: var(--pink); }

  /* 호버 시 레이싱 화살표 + 보러가기 버튼 (차트 페이지와 동일) */
  .go { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .trail { position: relative; width: 52px; height: 20px; overflow: hidden; color: var(--lav); }
  .trail svg { position: absolute; left: 0; top: 2px; width: 10px; height: 16px; opacity: 0; }
  .row-item:hover .trail svg, .row-item:focus-visible .trail svg { animation: race .8s cubic-bezier(.3, 0, .7, 1) infinite; }
  .trail svg:nth-child(2) { animation-delay: .16s !important; }
  .trail svg:nth-child(3) { animation-delay: .32s !important; }
  @keyframes race {
    0%   { transform: translateX(-10px); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translateX(52px); opacity: 0; }
  }
  .icon { width: 36px; height: 36px; border-radius: 50%; background: var(--lav); color: var(--ink); display: grid; place-items: center; flex-shrink: 0;
          opacity: 0; transform: translateX(-14px) scale(.85); transition: opacity .2s, transform .25s cubic-bezier(.2, .9, .3, 1.3); }
  .icon svg { width: 10px; height: 16px; margin-left: 2px; }
  .row-item:hover .icon, .row-item:focus-visible .icon { opacity: 1; transform: none; }
  @media (hover: none) { .trail { display: none; } .icon { opacity: 1; transform: none; width: 32px; height: 32px; } }
  @media (prefers-reduced-motion: reduce) { .trail { display: none; } .icon { transition: none; } }

  .periods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .period { background: var(--panel); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 210px; transition: background .2s, color .2s; }
  .period h3 { font-weight: 900; font-size: 34px; letter-spacing: -0.04em; }
  .period p { color: var(--dim); font-size: 15px; }
  .period .top { margin-top: auto; font-weight: 700; }
  .period .top span { display: block; font-size: 13px; font-weight: 500; color: var(--dim); }
  .period:hover { background: var(--lav); color: var(--ink); }
  .period:hover p, .period:hover .top span { color: #5A519A; }

  footer { text-align: center; padding: 32px; color: var(--dim); font-size: 13px; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .periods { grid-template-columns: 1fr; }
    .row-item { grid-template-columns: 40px 1fr auto auto; }
    .row-item .chg, .trail { display: none; }
    .thumb { width: 120px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="#"><i aria-hidden="true"><b style="height:14px"></b><b style="height:32px"></b><b style="height:22px"></b></i><span class="name">우리의차트<small>URICHARTS</small></span></a>
  <nav>
    <a href="#" aria-current="page">홈</a>
    <a href="chart.html">차트</a>
    <a href="#">소개</a>
  </nav>
</header>

<main>
  <div class="hero" id="hero"></div>

  <section>
    <div class="sec-head"><h2>이번 주 TOP 5</h2><a href="chart.html">주간 차트 전체 보기</a></div>
    <div class="board" id="board"></div>
  </section>

  <section>
    <div class="sec-head"><h2>기간별 차트</h2></div>
    <div class="periods" id="periods"></div>
  </section>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>

<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, num, short, date, esc } = KCHART
  const week = ranking('week')
  const leader = week[0]
  const CHEVRON = '<svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  const watchUrl = m => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${m.artist} ${m.title} MV`)

  document.getElementById('hero').innerHTML = `
    <div>
      <div class="hero-week">${PERIODS.week.label} 1위</div>
      <h1>${esc(leader.title)}</h1>
      <div class="winner">
        <div class="thumb" style="background:${leader.color}"></div>
        <div><div class="title">${esc(leader.artist)}</div><div class="artist">${date(leader.released)} 공개 · ${PERIODS.week.range}</div></div>
      </div>
    </div>
    <div class="counter">
      <div class="label">이번 주 조회수</div>
      <div class="big num" id="count">0</div>
      <div class="row"><span>누적 <b class="num">${short(leader.total)}</b></span><span>2위와 차이 <b class="num">+${short(leader.views - week[1].views)}</b></span></div>
    </div>`

  const max = week[0].views
  document.getElementById('board').innerHTML = week.slice(0, 5).map(m => `
    <a class="row-item" href="${watchUrl(m)}" target="_blank" rel="noopener" aria-label="${esc(m.artist)} ${esc(m.title)} 뮤직비디오 유튜브에서 보기">
      <div class="bar" style="width:${(m.views / max) * 100}%"></div>
      <div class="rank num">${m.rank}</div>
      <div><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div></div>
      <div class="v num">${short(m.views)}</div>
      <div class="chg ${m.change.kind}">${m.change.kind === 'up' ? '▲' : m.change.kind === 'down' ? '▼' : ''}${m.change.text}</div>
      <div class="go" aria-hidden="true"><span class="trail">${CHEVRON.repeat(3)}</span><span class="icon">${CHEVRON}</span></div>
    </a>`).join('')

  document.getElementById('periods').innerHTML = ['week', 'month', 'year'].map(k => {
    const p = PERIODS[k], r = ranking(k)[0]
    return `<a class="period" href="chart.html?p=${k}">
      <h3>${p.name}</h3><p>${p.label}<br>${p.range}</p>
      <div class="top"><span>현재 1위</span>${esc(r.artist)} – ${esc(r.title)}</div>
    </a>`
  }).join('')

  // 1위 조회수 카운트업
  const el = document.getElementById('count')
  const target = leader.views
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = num(target) }
  else {
    const t0 = performance.now(), dur = 1400
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4)
      el.textContent = num(Math.round(target * e))
      if (p < 1) requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  }
</script>
</body>
</html>
