<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 4 · 엽서 — 문의</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* 시안 4: 문의를 엽서 한 장으로. 왼쪽은 줄 쳐진 편지칸, 오른쪽은 우표·소인·주소칸. 보내면 엽서가 날아간다 */
      .wrap {
        width: 100%;
        max-width: calc(1040px + 2 * var(--gutter));
        margin: 0 auto;
        padding: clamp(40px, 7vh, 80px) var(--gutter) 140px;
        box-sizing: border-box;
      }

      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px 40px;
      }

      .head h1 {
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.055em;
        color: var(--strong);
      }

      .head p {
        max-width: 22em;
        font-size: 17px;
        color: var(--muted);
      }

      .stage {
        position: relative;
        margin-top: 40px;
        perspective: 1600px;
      }

      .card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) 2px minmax(0, 1fr);
        gap: clamp(20px, 3vw, 36px);
        padding: clamp(24px, 4vw, 44px);
        border-radius: 12px;
        background:
          radial-gradient(circle at 12% 0%, rgb(207 250 254 / 0.6), transparent 40%),
          #fffdf8;
        box-shadow:
          0 1px 0 rgb(8 51 68 / 0.05),
          0 40px 70px -40px rgb(8 51 68 / 0.45);
        transform: rotate(-1deg);
        transition: transform 0.5s var(--ease-pop);
      }

      .card:focus-within {
        transform: rotate(0deg);
      }

      /* 엽서 위 테두리 줄무늬 (항공우편 느낌을 cyan으로) */
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 12px;
        padding: 8px;
        background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, transparent 14px 28px, var(--cyan-300) 28px 42px, transparent 42px 56px);
        -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
        pointer-events: none;
      }

      .divider {
        background: repeating-linear-gradient(var(--fill) 0 8px, transparent 8px 14px);
      }

      /* 편지칸 */
      .letter {
        display: grid;
        align-content: start;
        gap: 18px;
      }

      .to {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--strong);
      }

      .topics {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 15px;
        color: var(--ink);
      }

      .topics label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      .topics input {
        appearance: none;
        width: 20px;
        height: 20px;
        margin: 0;
        border: 2px solid var(--muted);
        border-radius: 5px;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .topics input:checked::after {
        content: '✓';
        font-size: 18px;
        line-height: 1;
        font-weight: 900;
        color: var(--accent);
        transform: translate(1px, -3px) rotate(-6deg);
      }

      .lined {
        width: 100%;
        min-height: 264px;
        padding: 0 4px;
        border: 0;
        background: repeating-linear-gradient(transparent 0 43px, var(--fill) 43px 44px);
        background-attachment: local;
        font: inherit;
        font-size: 18px;
        line-height: 44px;
        color: var(--strong);
        resize: none;
      }

      .lined:focus {
        outline: none;
      }

      .lined::placeholder {
        color: color-mix(in srgb, var(--muted) 50%, transparent);
      }

      /* 주소칸 */
      .addr {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 24px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .postmark {
        display: grid;
        place-items: center;
        width: 104px;
        height: 104px;
        border: 2.5px solid color-mix(in srgb, var(--muted) 55%, transparent);
        border-radius: 50%;
        text-align: center;
        font-size: 11.5px;
        line-height: 1.35;
        font-weight: 800;
        color: color-mix(in srgb, var(--muted) 75%, transparent);
        transform: rotate(-14deg);
        box-shadow: inset 0 0 0 5px #fffdf8, inset 0 0 0 6.5px color-mix(in srgb, var(--muted) 35%, transparent);
      }

      .postmark b {
        display: block;
        font-size: 14.5px;
        letter-spacing: -0.03em;
      }

      /* 우표: 가장자리(padding) 띠에만 톱니 구멍을 뚫는다. 안쪽(content-box)은 통째로 보인다 */
      .stamp {
        width: 108px;
        padding: 6px;
        background: var(--accent);
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          radial-gradient(circle at 6px 6px, transparent 3.5px, #000 4px) 0 0 / 12px 12px;
        mask:
          linear-gradient(#000 0 0) content-box,
          radial-gradient(circle at 6px 6px, transparent 3.5px, #000 4px) 0 0 / 12px 12px;
        transform: rotate(4deg);
        filter: drop-shadow(0 2px 2px rgb(8 51 68 / 0.12));
      }

      .stamp > span {
        display: grid;
        place-items: center;
        gap: 6px;
        padding: 12px 6px 8px;
        border: 2px solid rgb(255 255 255 / 0.5);
        color: #fff;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .stamp .logo-tile {
        width: 52px;
        height: 52px;
        padding-bottom: 12px;
        gap: 4px;
        background: var(--strong);
      }

      .stamp .logo-tile b {
        width: 7px;
      }

      .stamp .logo-tile b:nth-child(1) { height: 15px; }
      .stamp .logo-tile b:nth-child(2) { height: 27px; }
      .stamp .logo-tile b:nth-child(3) { height: 20px; }

      .lines {
        display: grid;
        align-content: end;
        gap: 18px;
      }

      .line {
        display: grid;
        gap: 2px;
        border-bottom: 2px solid var(--fill);
      }

      .line span {
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
      }

      .line input,
      .line output {
        padding: 6px 0 8px;
        border: 0;
        background: none;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        color: var(--strong);
      }

      .line input:focus {
        outline: none;
      }

      .line:focus-within {
        border-color: var(--accent);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .actions .btn:disabled {
        background: var(--fill);
        color: var(--muted);
        cursor: not-allowed;
      }

      /* 보내면: 엽서가 위로 날아가고, 그 자리에 답장 안내 */
      .card.fly {
        animation: fly 0.9s cubic-bezier(0.5, -0.3, 0.7, 0.4) forwards;
      }

      @keyframes fly {
        30% {
          transform: rotate(-4deg) translateY(16px) scale(0.98);
        }
        100% {
          transform: rotate(-14deg) translate(30%, -120vh) scale(0.6);
          opacity: 0;
        }
      }

      .after {
        position: absolute;
        inset: 0;
        display: none;
        place-content: center;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }

      .stage.sent .after {
        display: grid;
        animation: pop-in 0.5s 0.7s var(--ease-pop) both;
      }

      .after .box {
        font-size: 72px;
        line-height: 1;
      }

      .after h2 {
        font-size: clamp(26px, 3vw, 34px);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--strong);
      }

      .after p {
        font-size: 17px;
        color: var(--muted);
      }

      .after .btn {
        margin-top: 12px;
        background: var(--fill-soft);
        color: var(--strong);
      }

      @media (max-width: 760px) {
        .card {
          grid-template-columns: 1fr;
          transform: none;
        }
        .divider {
          height: 2px;
          background: repeating-linear-gradient(90deg, var(--fill) 0 8px, transparent 8px 14px);
        }
        .addr {
          grid-row: 1;
        }
        .divider {
          grid-row: 2;
        }
      }
    </style>
  </head>
  <body>
    <div data-site-header></div>

    <main class="wrap">
      <header class="head">
        <h1>우리의차트에<br />엽서 한 장</h1>
        <p>빠진 곡, 이상한 숫자, 응원 한마디. 적어서 보내 주시면 메일로 답장해요.</p>
      </header>

      <div class="stage" data-stage>
        <form class="card" data-card novalidate>
          <div class="letter">
            <p class="to">우리의차트에게,</p>
            <fieldset class="topics" style="border: 0; padding: 0; margin: 0">
              <legend class="sr-only">어떤 이야기인가요?</legend>
              <span data-topics style="display: contents"></span>
            </fieldset>
            <label class="sr-only" for="msg">내용</label>
            <textarea class="lined" id="msg" rows="6" placeholder="여기에 적어 주세요. 곡 추가라면 유튜브 주소를 붙여 주세요." required></textarea>
            <div class="yt-preview" data-preview></div>
          </div>

          <span class="divider" aria-hidden="true"></span>

          <div class="addr">
            <div class="top">
              <span class="postmark" aria-hidden="true"><span>URICHARTS<b data-date></b>00:00</span></span>
              <span class="stamp" aria-hidden="true"><span><i class="logo-tile"><b></b><b></b><b></b></i>우리의차트</span></span>
            </div>

            <div class="lines">
              <label class="line">
                <span>보내는 사람</span>
                <input id="name" placeholder="이름 (선택)" />
              </label>
              <label class="line">
                <span>답장 받을 곳</span>
                <input id="email" type="email" placeholder="you@example.com" required />
              </label>
              <div class="line">
                <span>받는 사람</span>
                <output>우리의차트 · <span data-email style="font-size: inherit; color: inherit; font-weight: inherit"></span></output>
              </div>
            </div>

            <div class="actions">
              <span class="mock-note">시안이라 실제로 보내지는 않아요.</span>
              <button class="btn" type="submit" disabled data-send>우체통에 넣기</button>
            </div>
          </div>
        </form>

        <div class="after" role="status">
          <span class="box" aria-hidden="true">📮</span>
          <h2>우체통에 쏙!</h2>
          <p><b data-sent-to></b>으로 답장 갈게요.<br />보통 2~3일쯤 걸려요.</p>
          <button class="btn" type="button" data-again>한 장 더 쓰기</button>
        </div>
      </div>
    </main>

    <div data-site-footer></div>

    <script src="shared.js"></script>
    <script>
      document.querySelector('[data-email]').textContent = CONTACT.email
      document.querySelector('[data-date]').textContent = '2026.11.24'

      document.querySelector('[data-topics]').innerHTML = TOPICS.map(
        (t, i) => `<label><input type="radio" name="topic" value="${t.id}"${i === 0 ? ' checked' : ''} />${t.label}</label>`,
      ).join('')

      const msg = document.querySelector('#msg')
      bindYoutubePreview(msg, document.querySelector('[data-preview]'))

      const card = document.querySelector('[data-card]')
      const stage = document.querySelector('[data-stage]')
      const email = document.querySelector('#email')
      const send = document.querySelector('[data-send]')

      card.addEventListener('input', () => {
        send.disabled = !(msg.value.trim() && email.value && email.validity.valid)
      })

      card.addEventListener('submit', (e) => {
        e.preventDefault()
        document.querySelector('[data-sent-to]').textContent = email.value
        card.classList.add('fly')
        stage.classList.add('sent')
      })

      document.querySelector('[data-again]').addEventListener('click', () => {
        card.reset()
        document.querySelector('[data-preview]').classList.remove('show')
        send.disabled = true
        card.classList.remove('fly')
        stage.classList.remove('sent')
      })
    </script>
  </body>
</html>
