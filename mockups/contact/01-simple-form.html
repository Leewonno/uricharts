<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 1 · 반듯한 폼 — 문의</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* 시안 1: 왼쪽은 안내, 오른쪽은 흰 카드 폼. 가장 익숙한 모양. 문의 종류에 따라 필요한 칸만 더 나온다 */
      .contact {
        width: 100%;
        max-width: calc(var(--max) + 2 * var(--gutter));
        margin: 0 auto;
        padding: clamp(40px, 8vh, 88px) var(--gutter) 120px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        gap: clamp(32px, 6vw, 88px);
        align-items: start;
      }

      .aside {
        position: sticky;
        top: 110px;
      }

      .eyebrow {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--fill-soft);
        font-size: 13px;
        font-weight: 800;
        color: var(--accent);
      }

      .aside h1 {
        margin-top: 16px;
        font-size: clamp(34px, 4.6vw, 54px);
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--strong);
      }

      .aside .lead {
        margin-top: 16px;
        font-size: 18px;
        line-height: 1.7;
        color: var(--muted);
      }

      .facts {
        margin-top: 36px;
        display: grid;
        gap: 4px;
        border-radius: 24px;
        overflow: hidden;
      }

      .facts li {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding: 16px 18px;
        background: var(--surface);
      }

      .facts i {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--fill-soft);
        font-style: normal;
        font-size: 20px;
      }

      .facts b {
        display: block;
        font-size: 15.5px;
        color: var(--strong);
      }

      .facts span {
        font-size: 14px;
        color: var(--muted);
      }

      .facts a {
        font-weight: 700;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* 폼 카드 */
      .card {
        padding: clamp(24px, 4vw, 44px);
        border-radius: 32px;
        background: var(--surface);
        box-shadow: 0 30px 60px -40px rgb(8 51 68 / 0.35);
      }

      .form {
        display: grid;
        gap: 28px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .opt {
        margin-left: 4px;
        font-weight: 500;
        font-size: 13px;
        color: var(--muted);
      }

      /* 종류에 따라 나타나는 칸 */
      .extra {
        display: none;
      }

      .extra.show {
        display: grid;
        animation: pop-in 0.35s var(--ease-pop);
      }

      .count {
        justify-self: end;
        font-size: 13px;
        color: var(--muted);
      }

      .submit {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 8px;
        border-top: 2px solid var(--fill-soft);
      }

      .submit .btn {
        margin-top: 20px;
      }

      .submit .btn:disabled {
        background: var(--fill);
        color: var(--muted);
        cursor: not-allowed;
      }

      /* 보낸 뒤 */
      .done {
        display: none;
        padding: clamp(32px, 6vw, 64px) 0;
        text-align: center;
      }

      .card.sent .form {
        display: none;
      }

      .card.sent .done {
        display: block;
        animation: pop-in 0.45s var(--ease-pop);
      }

      .done .mark {
        display: inline-grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border-radius: 28px;
        background: var(--accent);
        color: #fff;
        font-size: 44px;
        font-weight: 900;
      }

      .done h2 {
        margin-top: 24px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--strong);
      }

      .done p {
        margin-top: 10px;
        font-size: 17px;
        color: var(--muted);
      }

      .done .btn {
        margin-top: 28px;
        background: var(--fill-soft);
        color: var(--strong);
      }

      @media (max-width: 860px) {
        .contact {
          grid-template-columns: 1fr;
        }
        .aside {
          position: static;
        }
      }

      @media (max-width: 520px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div data-site-header></div>

    <main class="contact">
      <section class="aside">
        <span class="eyebrow">문의</span>
        <h1>궁금한 점, 고칠 점<br />무엇이든 알려주세요</h1>
        <p class="lead">빠진 뮤직비디오, 이상한 숫자, 함께 하고 싶은 일까지. 남겨 주시면 메일로 답장 드릴게요.</p>
        <ul class="facts">
          <li>
            <i aria-hidden="true">✉️</i>
            <span><b>메일로 바로 보내도 돼요</b><a href="#" data-email></a></span>
          </li>
          <li>
            <i aria-hidden="true">⏱</i>
            <span><b>보통 2~3일 안에 답해요</b>주말·공휴일에는 조금 늦을 수 있어요</span>
          </li>
          <li>
            <i aria-hidden="true">🎬</i>
            <span><b>곡 추가는 유튜브 주소만 있으면 돼요</b>다음 날 0시 기록부터 들어가요</span>
          </li>
        </ul>
      </section>

      <section class="card" aria-label="문의 남기기">
        <form class="form" data-form novalidate>
          <div class="field">
            <span class="label" id="topic-label">어떤 이야기인가요?</span>
            <div class="chips" role="radiogroup" aria-labelledby="topic-label" data-topics></div>
          </div>

          <div class="field extra" data-extra="add">
            <label for="yt">추가할 MV 유튜브 주소</label>
            <input class="input" id="yt" type="url" placeholder="https://www.youtube.com/watch?v=..." />
            <div class="yt-preview" data-preview></div>
          </div>

          <div class="field extra" data-extra="fix">
            <label for="where">어디가 이상한가요?</label>
            <input class="input" id="where" placeholder="예) 주간 차트 3위 ‘CHOOM’ 조회수가 너무 적어요" />
          </div>

          <div class="row">
            <div class="field">
              <label for="name">이름<span class="opt">선택</span></label>
              <input class="input" id="name" placeholder="부르실 이름" />
            </div>
            <div class="field">
              <label for="email">답장 받을 메일</label>
              <input class="input" id="email" type="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="field">
            <label for="msg">내용</label>
            <textarea class="input" id="msg" maxlength="2000" placeholder="편하게 적어 주세요" required></textarea>
            <span class="count num" data-count>0 / 2,000</span>
          </div>

          <div class="submit">
            <label class="agree">
              <input type="checkbox" required data-agree />
              <span>답장을 위해 메일 주소를 받아요. 답장 후 3개월이 지나면 지워요.</span>
            </label>
            <button class="btn" type="submit" disabled data-send>보내기</button>
          </div>
          <p class="mock-note">시안이라 실제로 보내지는 않아요.</p>
        </form>

        <div class="done" role="status">
          <span class="mark" aria-hidden="true">✓</span>
          <h2>잘 받았어요!</h2>
          <p><b data-sent-to></b>으로 답장 드릴게요.</p>
          <button class="btn" type="button" data-again>하나 더 보내기</button>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="shared.js"></script>
    <script>
      const emailLink = document.querySelector('[data-email]')
      emailLink.textContent = CONTACT.email
      emailLink.href = `mailto:${CONTACT.email}`

      document.querySelector('[data-topics]').innerHTML = TOPICS.map(
        (t, i) =>
          `<label class="chip"><input type="radio" name="topic" value="${t.id}"${i === 0 ? ' checked' : ''} /><span>${t.label}</span></label>`,
      ).join('')

      const extras = document.querySelectorAll('[data-extra]')
      const showExtra = (id) => extras.forEach((el) => el.classList.toggle('show', el.dataset.extra === id))
      document.querySelectorAll('input[name=topic]').forEach((r) => r.addEventListener('change', () => showExtra(r.value)))
      showExtra('add')

      bindYoutubePreview(document.querySelector('#yt'), document.querySelector('[data-preview]'))

      const form = document.querySelector('[data-form]')
      const msg = document.querySelector('#msg')
      const email = document.querySelector('#email')
      const agree = document.querySelector('[data-agree]')
      const send = document.querySelector('[data-send]')
      const count = document.querySelector('[data-count]')

      const check = () => {
        count.textContent = `${msg.value.length.toLocaleString('ko-KR')} / 2,000`
        send.disabled = !(email.validity.valid && email.value && msg.value.trim() && agree.checked)
      }
      form.addEventListener('input', check)

      const card = document.querySelector('.card')
      form.addEventListener('submit', (e) => {
        e.preventDefault()
        document.querySelector('[data-sent-to]').textContent = email.value
        card.classList.add('sent')
      })
      document.querySelector('[data-again]').addEventListener('click', () => {
        form.reset()
        showExtra('add')
        document.querySelector('[data-preview]').classList.remove('show')
        check()
        card.classList.remove('sent')
      })
    </script>
  </body>
</html>
