<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 3 · 대화로 묻기 — 문의</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* 시안 3: 폼 대신 우리의차트가 말풍선으로 하나씩 물어본다. 소개 페이지 "묻고 답하기" 말풍선과 같은 모양 */
      .wrap {
        width: 100%;
        max-width: calc(720px + 2 * var(--gutter));
        margin: 0 auto;
        padding: clamp(32px, 6vh, 64px) var(--gutter) 120px;
        box-sizing: border-box;
      }

      .wrap > h1 {
        font-size: clamp(30px, 4.2vw, 46px);
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--strong);
      }

      .wrap > p {
        margin-top: 10px;
        font-size: 17px;
        color: var(--muted);
      }

      .room {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        border-radius: 32px;
        background: var(--surface);
        overflow: hidden;
        box-shadow: 0 30px 60px -40px rgb(8 51 68 / 0.35);
      }

      .room-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 2px solid var(--fill-soft);
      }

      .room-head .logo-tile {
        width: 40px;
        height: 40px;
      }

      .room-head b {
        display: block;
        font-size: 16px;
        color: var(--strong);
      }

      .room-head span {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      .room-head span::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
      }

      .log {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 440px;
        max-height: 62vh;
        padding: 24px 20px;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      .msg {
        max-width: 82%;
        padding: 13px 18px;
        font-size: 16.5px;
        line-height: 1.55;
        animation: pop-in 0.35s var(--ease-pop);
      }

      .msg.bot {
        align-self: flex-start;
        border-radius: 22px 22px 22px 6px;
        background: var(--fill-soft);
        color: var(--strong);
      }

      .msg.bot + .msg.bot {
        border-top-left-radius: 6px;
      }

      .msg.me {
        align-self: flex-end;
        border-radius: 22px 22px 6px 22px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      .msg.me + .msg.me {
        border-top-right-radius: 6px;
      }

      .msg.me img {
        width: 220px;
        margin-bottom: 8px;
        border-radius: 12px;
      }

      .msg .small {
        display: block;
        margin-top: 4px;
        font-size: 13.5px;
        opacity: 0.75;
      }

      /* "쓰는 중" 점 세 개 */
      .typing {
        align-self: flex-start;
        display: flex;
        gap: 5px;
        padding: 16px 18px;
        border-radius: 22px 22px 22px 6px;
        background: var(--fill-soft);
      }

      .typing i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--fill);
        animation: typing 0.9s ease-in-out infinite;
      }

      .typing i:nth-child(2) { animation-delay: 0.15s; }
      .typing i:nth-child(3) { animation-delay: 0.3s; }

      @keyframes typing {
        50% {
          transform: translateY(-4px);
          background: var(--accent);
        }
      }

      /* 빠른 답 */
      .quick {
        align-self: flex-end;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        max-width: 92%;
        animation: pop-in 0.35s var(--ease-pop);
      }

      .quick button {
        padding: 10px 16px;
        border: 2px solid var(--fill);
        border-radius: 999px;
        background: var(--surface);
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.25s var(--ease-pop);
      }

      .quick button:hover {
        border-color: var(--accent);
        background: var(--fill-soft);
        transform: translateY(-2px);
      }

      /* 보내기 전 요약 */
      .summary {
        align-self: stretch;
        margin: 6px 0;
        padding: 20px;
        border: 2px dashed var(--fill);
        border-radius: 22px;
        animation: pop-in 0.35s var(--ease-pop);
      }

      .summary h3 {
        font-size: 14px;
        font-weight: 800;
        color: var(--muted);
      }

      .summary dl {
        margin: 12px 0 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px 16px;
        font-size: 15px;
      }

      .summary dt {
        font-weight: 700;
        color: var(--muted);
      }

      .summary dd {
        margin: 0;
        color: var(--strong);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* 입력줄 */
      .composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 2px solid var(--fill-soft);
      }

      .composer .input {
        flex: 1;
        border-radius: 999px;
      }

      .composer .input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .composer .send {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background 0.2s, transform 0.25s var(--ease-pop);
      }

      .composer .send:hover:not(:disabled) {
        transform: rotate(-12deg) scale(1.06);
      }

      .composer .send:disabled {
        background: var(--fill);
        cursor: not-allowed;
      }

      .composer svg {
        width: 22px;
        height: 22px;
      }

      .below {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
      }

      .below a {
        font-weight: 700;
        color: var(--accent);
      }

      .below button {
        border: 0;
        background: none;
        padding: 0;
        font-weight: 700;
        color: var(--accent);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div data-site-header></div>

    <main class="wrap">
      <h1>무엇이든 물어보세요</h1>
      <p>폼을 채우는 대신, 우리의차트가 하나씩 여쭤볼게요.</p>

      <section class="room" aria-label="문의 대화">
        <div class="room-head">
          <i class="logo-tile" aria-hidden="true"><b></b><b></b><b></b></i>
          <div><b>우리의차트</b><span>보통 2~3일 안에 메일로 답해요</span></div>
        </div>
        <div class="log" data-log aria-live="polite"></div>
        <form class="composer" data-composer>
          <label class="sr-only" for="say">답 입력</label>
          <input class="input" id="say" autocomplete="off" disabled placeholder="위에서 골라 주세요" />
          <button class="send" type="submit" disabled aria-label="보내기" data-send></button>
        </form>
      </section>

      <p class="below">
        <span>메일로 바로: <a href="#" data-email></a></span>
        <button type="button" data-restart>처음부터 다시</button>
      </p>
      <p class="mock-note" style="margin-top: 6px">시안이라 실제로 보내지는 않아요.</p>
    </main>

    <div data-site-footer></div>

    <script src="shared.js"></script>
    <script>
      const emailLink = document.querySelector('[data-email]')
      emailLink.textContent = CONTACT.email
      emailLink.href = `mailto:${CONTACT.email}`

      const log = document.querySelector('[data-log]')
      const composer = document.querySelector('[data-composer]')
      const say = document.querySelector('#say')
      const sendBtn = document.querySelector('[data-send]')
      sendBtn.innerHTML = ICON_SEND

      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      const scrollDown = () => (log.scrollTop = log.scrollHeight)

      function add(html, cls) {
        const el = document.createElement('div')
        el.className = cls
        el.innerHTML = html
        log.append(el)
        scrollDown()
        return el
      }

      /** 점 세 개를 잠깐 보여준 뒤 우리의차트 말풍선을 띄운다 */
      let run = 0
      let cancelAsk = null
      const STALE = Symbol('stale')

      async function bot(html) {
        const id = run
        const dots = add('<i></i><i></i><i></i>', 'typing')
        await wait(500 + Math.min(html.length * 12, 700))
        // 기다리는 사이 "처음부터 다시"를 눌렀으면 이전 대화는 여기서 멈춘다
        if (id !== run) throw STALE
        dots.remove()
        add(html, 'msg bot')
        await wait(200)
      }

      const me = (html) => add(html, 'msg me')

      /** 빠른 답 버튼. 누른 답을 돌려준다 */
      function choose(options) {
        return new Promise((resolve) => {
          const box = add(options.map((o, i) => `<button type="button" data-i="${i}">${o}</button>`).join(''), 'quick')
          box.addEventListener('click', (e) => {
            const btn = e.target.closest('button')
            if (!btn) return
            box.remove()
            me(escapeHtml(btn.textContent))
            resolve(options[Number(btn.dataset.i)])
          })
        })
      }

      /** 입력줄로 답 받기. check가 false면 보내기 버튼이 잠긴다 */
      function ask({ placeholder, type = 'text', check = (v) => v.trim().length > 0, skip }) {
        return new Promise((resolve) => {
          let skipBox
          say.type = type
          say.disabled = false
          say.placeholder = placeholder
          say.value = ''
          say.focus()
          sendBtn.disabled = true
          const onInput = () => (sendBtn.disabled = !check(say.value))
          const done = (value) => {
            say.removeEventListener('input', onInput)
            composer.removeEventListener('submit', onSubmit)
            skipBox?.remove()
            cancelAsk = null
            say.disabled = true
            say.value = ''
            say.placeholder = '…'
            sendBtn.disabled = true
            resolve(value)
          }
          cancelAsk = () => {
            say.removeEventListener('input', onInput)
            composer.removeEventListener('submit', onSubmit)
            say.disabled = true
            say.value = ''
            sendBtn.disabled = true
          }
          const onSubmit = (e) => {
            e.preventDefault()
            if (sendBtn.disabled) return
            done(say.value.trim())
          }
          say.addEventListener('input', onInput)
          composer.addEventListener('submit', onSubmit)
          if (skip) {
            skipBox = add(`<button type="button">${skip}</button>`, 'quick')
            skipBox.addEventListener('click', () => {
              me(skip)
              done(null)
            })
          }
        })
      }

      function start() {
        run++
        cancelAsk?.()
        cancelAsk = null
        log.innerHTML = ''
        say.placeholder = '위에서 골라 주세요'
        talk().catch((e) => {
          if (e !== STALE) throw e
        })
      }

      async function talk() {
        const answers = {}

        await bot('안녕하세요! 우리의차트예요 👋')
        await bot('어떤 이야기를 하러 오셨어요?')
        const topic = await choose(TOPICS.map((t) => t.label))
        answers['종류'] = topic

        if (topic === '곡 추가 요청') {
          await bot('좋아요! 넣고 싶은 MV의 <b>유튜브 주소</b>를 붙여 주세요.')
          const url = await ask({ placeholder: 'https://youtu.be/...', check: (v) => Boolean(youtubeId(v)) })
          const yt = youtubeId(url)
          me(`<img src="${thumbUrl(yt)}" alt="" />${escapeHtml(url)}`)
          answers['영상'] = url
          await bot('이 영상 맞죠? 공식 MV면 다음 날 0시 기록부터 들어가요.')
        } else if (topic === '숫자·정보 오류') {
          await bot('어느 차트에서 보셨어요?')
          answers['차트'] = await choose(['일간', '주간', '월간', '연간'])
          await bot('무엇이 이상했는지 알려주세요. 곡 이름과 순위를 같이 적어 주시면 더 빨리 찾아요.')
          const text = await ask({ placeholder: '예) 연간 3위 2.0 조회수가 너무 적어요' })
          me(escapeHtml(text))
          answers['내용'] = text
        } else {
          await bot(topic === '제휴·광고' ? '반가워요! 어떤 제안인지 적어 주세요. 회사·팀 이름도 함께요.' : '편하게 적어 주세요. 응원 한마디도 좋아요 😊')
          const text = await ask({ placeholder: '여기에 적어 주세요' })
          me(escapeHtml(text))
          answers['내용'] = text
        }

        await bot('답장 받을 <b>메일 주소</b>를 알려주시겠어요?')
        const needsReply = topic === '제휴·광고'
        const mail = await ask({
          type: 'email',
          placeholder: 'you@example.com',
          check: (v) => /^\S+@\S+\.\S+$/.test(v),
          skip: needsReply ? undefined : '답장은 괜찮아요',
        })
        if (mail) me(escapeHtml(mail))
        answers['답장'] = mail ?? '받지 않음'

        await bot('이렇게 보낼게요.')
        const rows = Object.entries(answers)
          .map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`)
          .join('')
        add(`<h3>보낼 내용</h3><dl>${rows}</dl>`, 'summary')
        const ok = await choose(['보내기', '처음부터 다시'])
        if (ok !== '보내기') return start()

        await bot('보냈어요! 💌')
        await bot(mail ? `<b>${escapeHtml(mail)}</b>으로 답장 드릴게요. 고마워요.` : '하나하나 다 읽어요. 고마워요!')
      }

      document.querySelector('[data-restart]').addEventListener('click', start)
      start()
    </script>
  </body>
</html>
