<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 5 · 자주 묻는 질문 먼저 — 문의</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* 시안 5: 폼 없이, 자주 묻는 질문을 먼저 보여주고 답이 없으면 메일로. 보낼 서버가 없어도 바로 열 수 있는 모양 */
      .wrap {
        width: 100%;
        max-width: calc(800px + 2 * var(--gutter));
        margin: 0 auto;
        padding: clamp(40px, 7vh, 80px) var(--gutter) 0;
        box-sizing: border-box;
      }

      .wrap > h1 {
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--strong);
      }

      .wrap > .lead {
        margin-top: 14px;
        font-size: 18px;
        color: var(--muted);
      }

      .lead a {
        font-weight: 700;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .search {
        position: relative;
        margin-top: 32px;
      }

      .search svg {
        position: absolute;
        left: 22px;
        top: 50%;
        width: 22px;
        height: 22px;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }

      .search .input {
        padding: 20px 24px 20px 58px;
        border-radius: 999px;
        background: var(--surface);
        font-size: 18px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .filters .chip span {
        background: var(--surface);
      }

      .group {
        margin-top: 40px;
      }

      .group h2 {
        margin-bottom: 12px;
        font-size: 14px;
        font-weight: 800;
        color: var(--muted);
      }

      .faq {
        display: grid;
        gap: 8px;
      }

      .faq details {
        border-radius: 22px;
        background: var(--surface);
        transition: background 0.2s;
      }

      .faq summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 32px;
        gap: 16px;
        align-items: center;
        padding: 20px 24px;
        font-size: 17.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--strong);
        cursor: pointer;
        list-style: none;
      }

      .faq summary::-webkit-details-marker {
        display: none;
      }

      .faq summary::after {
        content: '+';
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--fill-soft);
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
        transition: transform 0.35s var(--ease-pop), background 0.2s, color 0.2s;
      }

      .faq details[open] summary::after {
        transform: rotate(45deg);
        background: var(--accent);
        color: #fff;
      }

      .faq summary:hover::after {
        background: var(--fill);
      }

      .faq .ans {
        padding: 0 24px 22px;
        font-size: 16px;
        line-height: 1.75;
        color: var(--ink);
        animation: pop-in 0.35s var(--ease-pop);
      }

      .faq .ans b {
        color: var(--strong);
      }

      .faq .ans .tag {
        display: inline-block;
        margin: 10px 6px 0 0;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--fill-soft);
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }

      mark {
        border-radius: 4px;
        background: var(--cyan-200);
        color: inherit;
      }

      .empty {
        display: none;
        margin-top: 40px;
        padding: 32px;
        border-radius: 22px;
        border: 2px dashed var(--fill);
        text-align: center;
        color: var(--muted);
      }

      .empty.show {
        display: block;
      }

      .empty b {
        display: block;
        font-size: 18px;
        color: var(--strong);
      }

      /* 답이 없으면: 진한 판에 메일 주소 */
      .mail {
        max-width: 960px;
        margin: clamp(64px, 10vh, 112px) auto 120px;
        padding: 0 var(--gutter);
        box-sizing: content-box;
      }

      .mail-card {
        position: relative;
        padding: clamp(28px, 5vw, 56px);
        border-radius: 32px;
        background: radial-gradient(120% 120% at 100% 0%, var(--cyan-800), var(--strong) 60%);
        color: var(--cyan-100);
        overflow: hidden;
      }

      .mail-card::after {
        content: '@';
        position: absolute;
        right: -20px;
        bottom: -90px;
        font-size: 320px;
        line-height: 1;
        font-weight: 900;
        color: rgb(255 255 255 / 0.05);
        pointer-events: none;
      }

      .mail-card h2 {
        font-size: clamp(26px, 3.2vw, 38px);
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -0.045em;
        color: #fff;
      }

      .mail-card > p {
        margin-top: 10px;
        font-size: 17px;
        color: var(--cyan-200);
      }

      .subject {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .subject .chip span {
        background: rgb(255 255 255 / 0.08);
        color: var(--cyan-100);
      }

      .subject .chip span:hover {
        background: rgb(255 255 255 / 0.16);
        color: #fff;
      }

      .subject .chip input:checked + span {
        background: var(--cyan-300);
        color: var(--strong);
      }

      .address {
        position: relative;
        z-index: 1;
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .address code {
        padding: 14px 22px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.1);
        font-family: inherit;
        font-size: clamp(18px, 2.2vw, 22px);
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.01em;
      }

      .copy-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 14px 20px;
        border: 0;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.1);
        font-size: 15px;
        font-weight: 700;
        color: var(--cyan-100);
        cursor: pointer;
        transition: background 0.2s;
      }

      .copy-btn:hover {
        background: rgb(255 255 255 / 0.18);
      }

      .copy-btn svg {
        width: 16px;
        height: 16px;
      }

      .copy-btn.ok {
        background: var(--cyan-300);
        color: var(--strong);
      }

      .mail-card .btn {
        background: var(--cyan-300);
        color: var(--strong);
      }

      .mail-card .btn:hover {
        background: #fff;
      }

      .tip {
        position: relative;
        z-index: 1;
        margin-top: 24px;
        font-size: 14px;
        color: var(--cyan-200);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div data-site-header></div>

    <main>
      <div class="wrap">
        <h1>궁금한 게 있으세요?</h1>
        <p class="lead">자주 묻는 질문부터 찾아보세요. 답이 없으면 <a href="#mail">메일로 물어봐 주세요</a>.</p>

        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <label class="sr-only" for="q">질문 찾기</label>
          <input class="input" id="q" type="search" placeholder="예) 주간 차트, 조회수, 곡 추가" autocomplete="off" />
        </div>
        <div class="filters chips" data-filters></div>

        <div data-groups></div>

        <div class="empty" data-empty>
          <b>찾는 답이 없네요</b>
          아래 메일로 물어봐 주시면 답해 드릴게요.
        </div>
      </div>

      <section class="mail" id="mail">
        <div class="mail-card">
          <h2>답을 못 찾았나요?<br />메일로 물어봐 주세요</h2>
          <p>무엇에 대한 이야기인지 고르면, 메일 제목을 채워서 열어 드려요.</p>

          <div class="subject chips" data-subject></div>

          <div class="address">
            <code data-email></code>
            <button class="copy-btn" type="button" data-copy></button>
            <a class="btn" href="#" data-mailto>메일 쓰기</a>
          </div>
          <p class="tip">곡 추가는 유튜브 주소를, 오류 제보는 차트 이름과 순위를 같이 적어 주시면 빨라요. 보통 2~3일 안에 답해요.</p>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="shared.js"></script>
    <script>
      const FAQ = [
        {
          group: '차트와 숫자',
          items: [
            {
              q: '조회수는 언제 바뀌나요?',
              a: '매일 밤 <b>0시</b>에 한 번, 모든 곡의 유튜브 누적 조회수를 적어 둬요. 그래서 차트 숫자는 하루에 한 번 바뀌어요.',
              tags: ['0시', '갱신'],
            },
            {
              q: '유튜브에서 보는 숫자와 왜 달라요?',
              a: '우리의차트는 <b>0시에 적은 숫자</b>를 보여줘요. 그 뒤로 늘어난 조회수는 다음 날 0시 기록에 들어가요. 유튜브가 조회수를 나중에 고치는 경우도 있어서 조금 차이가 날 수 있어요.',
              tags: ['조회수', '차이'],
            },
            {
              q: '일간·주간·월간 차트가 비어 있어요',
              a: '기록은 <b>2026년 11월 22일 0시</b>에 시작했어요. 일간은 기록 이틀째부터, 주간은 8일째부터, 월간은 한 달을 다 채우면 열려요. 연간 차트는 지금 볼 수 있어요.',
              tags: ['일간', '주간', '월간'],
            },
            {
              q: '그 전 기록은 왜 없나요?',
              a: '다른 사이트의 숫자를 가져와 채우지 않아요. <b>우리가 직접 적은 숫자만</b> 써야 차트를 믿을 수 있으니까요. 그래서 기록을 시작한 날부터 하루씩 쌓여요.',
              tags: ['과거 기록'],
            },
          ],
        },
        {
          group: '곡 추가',
          items: [
            {
              q: '어떤 곡이 차트에 들어가나요?',
              a: `아티스트 공식 채널에 올라온 K-pop <b>뮤직비디오</b>예요. 지금 ${CONTACT.tracked}곡을 기록하고 있어요. 퍼포먼스·라이브·티저 영상은 넣지 않아요.`,
              tags: ['기준', 'MV'],
            },
            {
              q: '빠진 곡을 넣어 달라고 할 수 있나요?',
              a: '네! 아래 메일로 <b>유튜브 주소</b>만 보내 주세요. 기준에 맞으면 다음 날 0시 기록부터 들어가요. 들어가기 전 조회수는 채우지 않아요.',
              tags: ['추가 요청'],
            },
          ],
        },
        {
          group: '그 밖에',
          items: [
            {
              q: '차트 데이터를 다른 곳에 써도 되나요?',
              a: '쓰려는 곳과 방법을 메일로 알려주시면 함께 이야기해 볼게요.',
              tags: ['데이터', '제휴'],
            },
            {
              q: '광고나 제휴를 하고 싶어요',
              a: '반가워요. 회사·팀 이름과 제안 내용을 메일로 보내 주세요.',
              tags: ['광고', '제휴'],
            },
          ],
        },
      ]

      const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      const groupsEl = document.querySelector('[data-groups]')
      const emptyEl = document.querySelector('[data-empty]')
      const search = document.querySelector('#q')
      let filter = '전체'

      document.querySelector('[data-filters]').innerHTML = ['전체', ...FAQ.map((g) => g.group)]
        .map((g, i) => `<label class="chip"><input type="radio" name="f" value="${g}"${i === 0 ? ' checked' : ''} /><span>${g}</span></label>`)
        .join('')
      document.querySelectorAll('input[name=f]').forEach((r) =>
        r.addEventListener('change', () => {
          filter = r.value
          render()
        }),
      )

      /** 글자 사이(태그 밖)에서만 찾은 말을 칠한다 */
      const highlight = (html, word) =>
        word ? html.replace(new RegExp(`(${escapeRe(word)})(?![^<]*>)`, 'gi'), '<mark>$1</mark>') : html

      function render() {
        const word = search.value.trim()
        const plain = (s) => s.replace(/<[^>]+>/g, '')
        let shown = 0
        groupsEl.innerHTML = FAQ.filter((g) => filter === '전체' || g.group === filter)
          .map((g) => {
            const items = g.items.filter(
              (it) => !word || [it.q, plain(it.a), ...it.tags].some((t) => t.toLowerCase().includes(word.toLowerCase())),
            )
            shown += items.length
            if (!items.length) return ''
            return `
              <section class="group">
                <h2>${g.group}</h2>
                <div class="faq">
                  ${items
                    .map(
                      (it) => `
                    <details${word ? ' open' : ''}>
                      <summary>${highlight(it.q, word)}</summary>
                      <div class="ans">${highlight(it.a, word)}<br />${it.tags.map((t) => `<span class="tag">#${t}</span>`).join('')}</div>
                    </details>`,
                    )
                    .join('')}
                </div>
              </section>`
          })
          .join('')
        emptyEl.classList.toggle('show', shown === 0)
      }

      search.addEventListener('input', render)
      render()

      // 메일
      document.querySelector('[data-email]').textContent = CONTACT.email
      document.querySelector('[data-subject]').innerHTML = TOPICS.map(
        (t, i) => `<label class="chip"><input type="radio" name="s" value="${t.label}"${i === 0 ? ' checked' : ''} /><span>${t.label}</span></label>`,
      ).join('')

      const mailto = document.querySelector('[data-mailto]')
      const setMailto = () => {
        const topic = document.querySelector('input[name=s]:checked').value
        mailto.href = `mailto:${CONTACT.email}?subject=${encodeURIComponent(`[${topic}] `)}`
      }
      document.querySelectorAll('input[name=s]').forEach((r) => r.addEventListener('change', setMailto))
      setMailto()

      const copyBtn = document.querySelector('[data-copy]')
      const copyIdle = `${ICON_COPY}복사`
      copyBtn.innerHTML = copyIdle
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(CONTACT.email)
          copyBtn.classList.add('ok')
          copyBtn.textContent = '복사했어요'
        } catch {
          copyBtn.textContent = '직접 복사해 주세요'
        }
        setTimeout(() => {
          copyBtn.classList.remove('ok')
          copyBtn.innerHTML = copyIdle
        }, 1600)
      })
    </script>
  </body>
</html>
