<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 — 연도별 차트 (공개연도 기준)</title>

    --color-page: var(--color-cyan-50);

    --color-fill: var(--color-cyan-200);

<body>
  <!-- 시안 고르기 (실제 화면에는 없음) -->
  <div class="sticky top-0 z-40 bg-strong px-4 py-2.5 text-cyan-50">
    <div class="mx-auto flex max-w-[1280px] flex-wrap items-center gap-x-5 gap-y-2">
      <span class="text-sm font-bold">시안</span>
      <div id="variant-tabs" class="flex gap-1"></div>
      <span class="h-5 w-px bg-cyan-700"></span>
      <span class="text-sm font-bold">오늘이</span>
      <div id="scenario-tabs" class="flex gap-1"></div>
    </div>
    <p id="variant-note" class="mx-auto mt-1.5 max-w-[1280px] text-sm font-semibold text-cyan-200"></p>
  </div>

  <header class="mx-auto flex w-full max-w-[1280px] items-center px-[clamp(16px,4vw,48px)] py-5">
    <span class="text-xl font-extrabold tracking-[-0.03em] text-strong">우리의차트</span>
  </header>

  <main class="mx-auto w-full max-w-[1280px] px-[clamp(16px,4vw,48px)] pt-4 pb-16">
    <h1 class="mt-3 mb-6 text-[clamp(28px,3.5vw,40px)] leading-[1.1] font-bold tracking-[-0.04em] text-strong">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="mr-[0.25em] inline-block size-[1.15em] align-[-0.24em]" fill="currentColor"><path d="M23.5 6.5a3 3 0 0 0-2.1-2.1C19.5 4 12 4 12 4s-7.5 0-9.4.4A3 3 0 0 0 .5 6.5 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.5 3 3 0 0 0 2.1 2.1c1.9.4 9.4.4 9.4.4s7.5 0 9.4-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.5ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
      K-POP MV 조회수 순위
    </h1>

    <div id="head"></div>
    <div id="notice"></div>
    <div id="table"></div>
  </main>

<script>
/* ---------- 데이터 (조회수·변동은 예시 값) ---------- */

const SONGS = {
  2026: [
    ['FyS5dAywkEo', 'SaWaDiKa', 'LISA', '2026-09-04'],
    ['bMhDJ0S0OBA', "It's Me", 'ILLIT', '2026-04-30'],
    ['_gyultVTesk', '2.0', 'BTS', '2026-04-02'],
    ['x3eqqoZPV_E', 'CHOOM', 'BABYMONSTER', '2026-05-04'],
    ['27C4pfRsf9g', 'ICONIC BY MISTAKE', 'LE SSERAFIM x ILLIT x KATSEYE', '2026-06-11'],
    ['b4iVv91Z6lY', 'SWIM', 'BTS', '2026-03-20'],
    ['BZ4UzthYTss', 'This & That', 'Stray Kids', '2026-08-07'],
    ['F7sGJVUrkjQ', 'RUDE!', 'Hearts2Hearts', '2026-02-20'],
    ['naoGk-Zjc1s', 'SUGAR HONEY ICE TEA', 'BABYMONSTER', '2026-06-08'],
    ['QERKD90hG98', 'IF I', 'TREASURE', '2026-06-01'],
    ['0JQ9k6kcKVs', 'BABY ANGEL', 'NAYEON', '2026-11-20'],
    ['M9G4guYg-i8', 'Angel Bite', 'TXT', '2026-11-16'],
  ],
  // 2027년 곡은 아직 없으니 자리만 채운다
  2027: [
    [null, '새해 신곡 A', '아티스트 A', '2027-01-01'],
    [null, '새해 신곡 B', '아티스트 B', '2027-01-01'],
    [null, '새해 신곡 C', '아티스트 C', '2027-01-02'],
    [null, '새해 신곡 D', '아티스트 D', '2027-01-02'],
    [null, '새해 신곡 E', '아티스트 E', '2027-01-03'],
    [null, '새해 신곡 F', '아티스트 F', '2027-01-04'],
  ],
}

const VARIANTS = [
  ['연도 먼저', '맨 위에서 연도(공개연도)를 먼저 고르고, 그 안에서 일간~연간을 고른다. 화살표는 그 해 안에서만 움직인다'],
  ['한 줄 문장', '"2027년 공개곡 · 주간 · 1주차" 를 한 줄 문장으로. 밑줄 글자를 누르면 각각 바꿀 수 있다'],
  ['시즌 카드', '연도를 "시즌"처럼 카드로 보여준다. 1월 1일 ~ 12월 31일 중 어디까지 왔는지 막대로 표시'],
]
const SCENARIOS = [
  ['2026-11-24', '2026년 11월 24일'],
  ['2027-01-05', '2027년 1월 5일 (새해 직후)'],
]
const PERIODS = [['day', '일간', '날', '하루'], ['week', '주간', '주', '주'], ['month', '월간', '달', '달'], ['year', '연간', '해', '해']]
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토']

/* ---------- 날짜 ---------- */

const D = (s) => new Date(`${s}T00:00:00Z`)
const iso = (d) => d.toISOString().slice(0, 10)
const addDays = (d, n) => new Date(d.getTime() + n * 86400000)
const md = (d) => `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일`
const mdw = (d) => `${md(d)}(${WEEKDAYS[d.getUTCDay()]})`
const mondayOf = (d) => addDays(d, -((d.getUTCDay() + 6) % 7))
const yearOf = (d) => d.getUTCFullYear()

/**
 * 한 해(=공개연도)의 고를 수 있는 기간 (최근부터).
 * 그 해 1월 1일 0시 ~ 다음 해 1월 1일 0시 기록만 쓴다. 새해가 낀 주는 해에 맞춰 잘린다.
 */
function slotsOf(year, period, today) {
  const jan1 = D(`${year}-01-01`)
  const dec31 = D(`${year}-12-31`)
  const lastDone = addDays(today, -1) // 오늘 0시 기록까지 = 어제까지 집계
  const last = lastDone < dec31 ? lastDone : dec31
  if (last < jan1) return []
  const list = []
  if (period === 'day') {
    for (let d = jan1; d <= last; d = addDays(d, 1)) {
      list.push({ key: iso(d), label: `${md(d)} (${WEEKDAYS[d.getUTCDay()]})`, short: md(d), first: +d === +jan1, start: d, end: d })
    }
  }
  if (period === 'week') {
    let n = 1
    for (let m = mondayOf(jan1); m <= dec31; m = addDays(m, 7), n++) {
      const start = m < jan1 ? jan1 : m
      const sun = addDays(m, 6)
      const end = sun > dec31 ? dec31 : sun
      if (end > last) break // 끝난 주만
      const days = (end - start) / 86400000 + 1
      list.push({ key: `${year}-W${n}`, label: `${n}주차`, range: `${mdw(start)} ~ ${mdw(end)}`, days, first: n === 1, start, end })
    }
  }
  if (period === 'month') {
    for (let mo = 0; mo < 12; mo++) {
      const start = new Date(Date.UTC(year, mo, 1))
      if (start > last) break
      const monthEnd = new Date(Date.UTC(year, mo + 1, 0))
      if (monthEnd > last) break // 끝난 달만 (11월이 안 끝났으면 10월까지)
      list.push({ key: `${year}-${mo + 1}`, label: `${mo + 1}월`, first: mo === 0, start, end: monthEnd })
    }
  }
  if (period === 'year') {
    const partial = last < dec31
    list.push({ key: `${year}`, label: `${year}년`, partial, until: last, first: false, start: jan1, end: last })
  }
  return list.reverse()
}

const seasonsOf = (today) => {
  const ys = []
  for (let y = yearOf(addDays(today, -1)); y >= 2026; y--) ys.push(y)
  return ys
}
const isClosed = (year, today) => addDays(today, -1) >= D(`${year}-12-31`)

/* ---------- 순위 (예시 값) ---------- */

const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7)
const SCALE = { day: 1, week: 6.4, month: 27, year: 260 }

function rowsOf(year, period, slot) {
  const songs = SONGS[year].filter((s) => D(s[3]) <= slot.end)
  return songs
    .map(([yt, title, artist, released], i) => {
      const base = (13 - i) * 90_000 + (hash(title + slot.key) % 70_000)
      const fresh = D(released) >= slot.start ? 0.6 : 1
      const views = Math.round(base * SCALE[period] * fresh * (slot.days ? slot.days / 7 : 1))
      // 누적: 기간 끝까지 쌓인 전체 조회수 (공개 후 날이 갈수록 늘어난다)
      const age = (slot.end - D(released)) / 86400000 + 1
      const total = Math.round(((13 - i) * 90_000 + (hash(title) % 70_000)) * 260 * Math.min(1, age / 200))
      return { yt, title, artist, released, views, total: Math.max(total, views) }
    })
    .sort((a, b) => b.views - a.views)
    .map((r, i) => {
      let change = 'none'
      if (!slot.first && period !== 'year') {
        const h = hash(r.title + slot.key + 'c') % 9
        change = D(r.released) >= slot.start ? 'new' : h < 3 ? `up${(h % 3) + 1}` : h < 6 ? `down${(h % 3) + 1}` : 'same'
      }
      return { ...r, rank: i + 1, change }
    })
}

/* ---------- 상태 ---------- */

const state = { variant: 0, scenario: 0, year: 2026, period: 'week', key: null, open: null }
const today = () => D(SCENARIOS[state.scenario][0])

function reset() {
  state.year = seasonsOf(today())[0]
  state.key = null
  state.open = null
}

function ctx() {
  const t = today()
  const slots = slotsOf(state.year, state.period, t)
  const slot = slots.find((s) => s.key === state.key) ?? slots[0]
  const i = slots.indexOf(slot)
  const seasons = seasonsOf(t)
  return {
    t,
    slots,
    slot,
    older: slots[i + 1],
    newer: slots[i - 1],
    seasons,
    closed: isClosed(state.year, t),
    prevSeason: seasons.find((y) => y === state.year - 1),
    nextSeason: seasons.find((y) => y === state.year + 1),
    pname: PERIODS.find((p) => p[0] === state.period),
  }
}

/* ---------- 공통 조각 ---------- */

const ICON = {
  left: '<svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  info: '<svg viewBox="0 0 24 24" class="size-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
}

const statusPill = (year, t) =>
  isClosed(year, t)
    ? `<span class="inline-flex items-center gap-1 rounded-full bg-strong px-2.5 py-0.5 text-xs font-bold text-cyan-50">${ICON.lock}마감</span>`
    : `<span class="inline-flex items-center gap-1.5 rounded-full bg-fill px-2.5 py-0.5 text-xs font-bold text-ink"><span class="size-1.5 animate-pulse rounded-full bg-accent"></span>집계 중</span>`

function periodTabs() {
  return `<nav class="inline-flex gap-1 rounded-full bg-surface p-1.5">${PERIODS.map(
    ([p, name]) =>
      `<button data-period="${p}" class="rounded-full px-[26px] py-2 text-lg font-bold max-md:px-[18px] max-md:text-base ${
        p === state.period ? 'bg-fill text-ink' : 'text-muted hover:text-ink'
      }">${name}</button>`,
  ).join('')}</nav>`
}

/** 기간 부제: 주 범위, 집계 중 표시 */
function slotSub(slot) {
  if (!slot) return ''
  if (slot.range) return slot.days < 7 ? `${slot.range} · ${slot.days}일` : slot.range
  if (slot.partial) return `${md(slot.until)}까지 집계`
  return ''
}

function slotMenu(c) {
  if (state.open !== 'slot') return ''
  return `<ul class="absolute top-full left-1/2 z-20 mt-2 grid max-h-80 min-w-72 -translate-x-1/2 animate-fade-in gap-0.5 overflow-y-auto rounded-3xl bg-surface p-1.5 shadow-lg shadow-cyan-900/10">
    ${c.slots
      .map(
        (s) => `<li><button data-slot="${s.key}" class="flex w-full items-baseline justify-between gap-6 rounded-full px-5 py-2 text-left text-[17px] font-bold whitespace-nowrap ${
          s.key === c.slot.key ? 'bg-fill text-ink' : 'text-muted hover:bg-fill-soft hover:text-ink'
        }"><span>${s.label}</span><span class="text-sm font-semibold opacity-80">${s.partial ? '집계 중' : s.range ? (s.days < 7 ? `${s.days}일` : s.range) : ''}</span></button></li>`,
      )
      .join('')}
  </ul>`
}

/** ‹ 기간 › — 그 해 안에서만 움직인다. 해의 처음·끝에서는 화살표가 흐려진다 */
function stepper(c, { size = 'text-xl' } = {}) {
  const arrow = (target, dir) =>
    target
      ? `<button data-slot="${target.key}" aria-label="${dir === 'left' ? '이전' : '다음'}" class="grid size-8 place-items-center rounded-full text-strong hover:text-accent">${ICON[dir]}</button>`
      : `<span class="grid size-8 place-items-center text-muted/25">${ICON[dir]}</span>`
  const one = c.slots.length <= 1
  const off = c.slot.disabled
  return `<div class="flex flex-col items-center gap-1">
    <div class="flex items-center gap-1">
      ${arrow(c.older, 'left')}
      <div class="relative">
        <button data-open="slot" ${one ? 'disabled' : ''} class="block rounded-lg px-1 ${size} leading-tight font-semibold tracking-[-0.02em] ${off ? 'text-muted/40' : 'text-strong'} ${one ? 'cursor-default' : 'decoration-fill decoration-2 underline-offset-[5px] hover:underline'}">${c.slot.label}</button>
        ${slotMenu(c)}
      </div>
      ${arrow(c.newer, 'right')}
    </div>
    ${slotSub(c.slot) ? `<span class="text-[15px] font-semibold text-muted">${slotSub(c.slot)}</span>` : ''}
  </div>`
}

/* ---------- 안내 ---------- */

function notices(c) {
  const out = []
  if (c.closed) {
    out.push({
      tone: 'dark',
      title: `${state.year}년 차트는 마감됐어요`,
      body: `${state.year}년 12월 31일까지의 최종 순위예요.`,
      action: c.nextSeason ? `<button data-year="${c.nextSeason}" class="shrink-0 rounded-full bg-cyan-50 px-4 py-2 text-sm font-bold text-strong hover:bg-fill">${c.nextSeason}년 차트 보기</button>` : '',
    })
  }
  const soft = out.filter((n) => n.tone === 'soft')
  const merged = soft.length > 1 ? [{ tone: 'soft', title: soft.map((n) => n.title).join(' · '), body: soft.map((n) => n.body).join('<br>') }] : soft
  return [...out.filter((n) => n.tone === 'dark'), ...merged]
    .map(
      (n) => `<div class="mb-3 flex items-center gap-3 rounded-[18px] px-5 py-3.5 ${n.tone === 'dark' ? 'bg-strong text-cyan-50' : 'bg-surface text-ink'}">
        <span class="${n.tone === 'dark' ? 'text-cyan-300' : 'text-accent'}">${ICON.info}</span>
        <div class="min-w-0 flex-1"><p class="font-bold">${n.title}</p><p class="text-sm font-semibold ${n.tone === 'dark' ? 'text-cyan-200' : 'text-muted'}">${n.body}</p></div>
        ${n.action ?? ''}
      </div>`,
    )
    .join('')
}

/* ---------- 순위 표 ---------- */

const changeCell = (ch) => {
  if (ch === 'none') return '<span class="text-muted">–</span>'
  if (ch === 'new') return '<span class="text-pink-600">NEW</span>'
  if (ch === 'same') return '<span class="text-muted">–</span>'
  const n = ch.replace(/\D/g, '')
  return ch.startsWith('up') ? `<span class="text-accent">▲${n}</span>` : `<span class="text-muted">▼${n}</span>`
}

function table(c) {
  if (!c.slot) {
    // 그 해 첫 기간이 아직 안 끝났을 때 (1월의 월간 등)
    return `<div class="rounded-[20px] bg-surface px-6 py-16 text-center"><p class="text-xl font-bold text-strong">아직 집계 중이에요</p></div>`
  }
  const rows = rowsOf(state.year, state.period, c.slot)
  if (!rows.length) {
    return `<div class="rounded-[20px] bg-surface px-6 py-16 text-center"><p class="text-xl font-bold text-strong">이 기간에 집계된 곡이 없어요</p><p class="mt-2 font-semibold text-muted">${state.year}년에 공개된 곡이 아직 없어요.</p></div>`
  }
  const isYear = state.period === 'year'
  const cols = isYear ? 'md:grid-cols-[64px_1fr_110px_170px]' : 'md:grid-cols-[64px_1fr_150px_150px_72px]'
  const max = rows[0].views
  const head = `<div class="grid gap-4 px-5 pb-2 text-[13px] font-semibold text-muted max-md:hidden ${cols}">
    <span>순위</span><span>노래</span>${isYear ? '<span class="text-center">공개일</span>' : '<span class="text-right">누적</span>'}<span class="text-right">조회수</span>
    ${isYear ? '' : `<span class="text-center">변동</span>`}
  </div>`
  const body = rows
    .map(
      (r) => `<li><div class="relative grid grid-cols-[40px_1fr_auto] items-center gap-3 overflow-hidden rounded-[14px] bg-surface px-5 py-3.5 md:gap-4 ${cols}">
        <div class="absolute inset-y-0 left-0 bg-gradient-to-r from-fill/50 to-transparent" style="width:${(r.views / max) * 100}%"></div>
        <div class="relative text-[26px] leading-none font-semibold tabular-nums">${r.rank}</div>
        <div class="relative flex min-w-0 items-center gap-3.5">
          ${
            r.yt
              ? `<img src="https://i.ytimg.com/vi/${r.yt}/mqdefault.jpg" alt="" class="aspect-video w-24 rounded-lg bg-fill-soft object-cover max-sm:hidden" />`
              : `<div class="aspect-video w-24 rounded-lg bg-gradient-to-br from-cyan-200 to-cyan-400 max-sm:hidden"></div>`
          }
          <div class="min-w-0"><div class="truncate text-[17px] font-bold">${r.title}</div><div class="truncate text-sm text-muted">${r.artist}</div></div>
        </div>
        ${
          isYear
            ? `<div class="relative text-center text-sm tracking-[-0.04em] text-muted tabular-nums max-md:hidden">${r.released.replaceAll('-', '.')}</div>`
            : `<div class="relative text-right text-base font-semibold tracking-[-0.04em] text-muted tabular-nums max-md:hidden">${r.total.toLocaleString('ko-KR')}</div>`
        }
        <div class="relative text-right text-xl font-semibold tracking-[-0.04em] tabular-nums">${r.views.toLocaleString('ko-KR')}</div>
        ${isYear ? '' : `<div class="relative text-center text-sm font-bold max-md:hidden">${changeCell(r.change)}</div>`}
      </div></li>`,
    )
    .join('')
  return head + `<ol class="grid gap-2">${body}</ol>`
}

/* ---------- 시안 1: 연도 먼저 ---------- */

function headV1(c) {
  const open = state.open === 'season'
  const items = c.seasons
    .map(
      (y) => `<li><button data-year="${y}" class="flex w-full items-center justify-between gap-6 rounded-full px-5 py-2 text-left text-[17px] font-bold whitespace-nowrap ${
        y === state.year ? 'bg-fill text-ink' : 'text-muted hover:bg-fill-soft hover:text-ink'
      }"><span class="tabular-nums">${y}년</span>${
        isClosed(y, c.t) ? '' : '<span class="flex items-center gap-1.5 text-sm font-bold text-accent"><span class="size-1.5 animate-pulse rounded-full bg-accent"></span>집계 중</span>'
      }</button></li>`,
    )
    .join('')
  // 연도 드롭다운: 기간 탭과 같은 높이로 왼쪽에 둔다
  const season = `<div class="relative">
    <button data-open="season" aria-haspopup="listbox" aria-expanded="${open}" class="flex h-full items-center gap-2 rounded-full bg-strong pr-4 pl-6 text-lg font-bold text-cyan-50 hover:bg-cyan-900 max-md:text-base">
      <span class="tabular-nums">${state.year}년</span>
      <span class="transition-transform ${open ? 'rotate-180' : ''}">${ICON.down}</span>
    </button>
    ${
      open
        ? `<ul class="absolute top-full left-0 z-20 mt-2 grid min-w-52 animate-fade-in gap-0.5 rounded-3xl bg-surface p-1.5 shadow-lg shadow-cyan-900/10">${items}</ul>`
        : ''
    }
  </div>`
  return `
    <div class="mb-6 flex flex-wrap items-stretch gap-2">${season}${periodTabs()}</div>
    <div class="mb-5">${state.period === 'year' ? '' : stepper(c.slot ? c : { ...c, slots: [], slot: firstSlot(state.period) })}</div>`
}

/** 그 해 첫 기간 (아직 안 끝나 고를 수 없을 때 버튼 자리에 흐리게 보여준다) */
function firstSlot(period) {
  const jan1 = D(`${state.year}-01-01`)
  const label = { day: `${md(jan1)} (${WEEKDAYS[jan1.getUTCDay()]})`, week: '1주차', month: '1월' }[period]
  return { key: 'pending', label, disabled: true }
}

/* ---------- 시안 2: 한 줄 문장 ---------- */

function pick(id, label, items) {
  const open = state.open === id
  return `<span class="relative inline-block">
    <button data-open="${id}" class="inline-flex items-center gap-1 rounded-xl px-2 text-strong decoration-fill decoration-[3px] underline underline-offset-[6px] hover:bg-surface ${open ? 'bg-surface' : ''}">${label}<span class="text-muted">${ICON.down}</span></button>
    ${
      open
        ? `<ul class="absolute top-full left-0 z-20 mt-2 grid min-w-52 animate-fade-in gap-0.5 rounded-3xl bg-surface p-1.5 text-base shadow-lg shadow-cyan-900/10">${items.join('')}</ul>`
        : ''
    }
  </span>`
}
const menuItem = (attr, label, selected, sub = '') =>
  `<li><button ${attr} class="flex w-full items-baseline justify-between gap-4 rounded-full px-4 py-2 text-left font-bold whitespace-nowrap ${
    selected ? 'bg-fill text-ink' : 'text-muted hover:bg-fill-soft hover:text-ink'
  }"><span>${label}</span><span class="text-sm font-semibold opacity-80">${sub}</span></button></li>`

function headV2(c) {
  const years = c.seasons.map((y) => menuItem(`data-year="${y}"`, `${y}년 공개곡`, y === state.year, isClosed(y, c.t) ? '마감' : '집계 중'))
  const periods = PERIODS.map(([p, name]) => menuItem(`data-period="${p}"`, name, p === state.period))
  return `
    <div class="mb-6 rounded-3xl bg-white/60 px-6 py-5">
      <p class="text-[clamp(20px,2.4vw,28px)] leading-[1.7] font-bold tracking-[-0.03em] text-ink">
        ${pick('year', `${state.year}년 공개곡`, years)}의
        ${pick('period', c.pname[1], periods)} 조회수 순위
        ${c.slot ? `<span class="text-muted">·</span> ${stepperInline(c)}` : ''}
      </p>
      <p class="mt-1 flex flex-wrap items-center gap-2 text-[15px] font-semibold text-muted">
        ${statusPill(state.year, c.t)}
        ${state.year}년 1월 1일 ~ 12월 31일에 공개된 MV만 모아, ${c.closed ? '12월 31일까지 센 조회수로 매긴 최종 순위예요' : '매일 0시 조회수로 순위를 매겨요'}
        ${slotSub(c.slot) ? `<span class="text-muted/50">|</span> ${slotSub(c.slot)}` : ''}
      </p>
    </div>`
}
function stepperInline(c) {
  if (c.slots.length <= 1) return `<span class="px-1 text-strong">${c.slot.label}</span>`
  const arrow = (target, dir) =>
    target
      ? `<button data-slot="${target.key}" class="inline-grid size-8 place-items-center rounded-full align-[-0.1em] text-strong hover:text-accent">${ICON[dir]}</button>`
      : `<span class="inline-grid size-8 place-items-center align-[-0.1em] text-muted/25">${ICON[dir]}</span>`
  const items = c.slots.map((s) => menuItem(`data-slot="${s.key}"`, s.label, s.key === c.slot.key, s.partial ? '집계 중' : s.days && s.days < 7 ? `${s.days}일` : s.range ?? ''))
  return `<span class="whitespace-nowrap">${arrow(c.older, 'left')}${pick('slot', c.slot.label, items).replace('left-0', 'left-0 max-h-80 overflow-y-auto')}${arrow(c.newer, 'right')}</span>`
}

/* ---------- 시안 3: 시즌 카드 ---------- */

function headV3(c) {
  const jan1 = D(`${state.year}-01-01`)
  const last = c.closed ? D(`${state.year}-12-31`) : addDays(c.t, -1)
  const dayCount = (a, b) => (b - a) / 86400000 + 1
  const pct = (dayCount(jan1, last) / dayCount(jan1, D(`${state.year}-12-31`))) * 100
  const left = Math.round((D(`${state.year}-12-31`) - last) / 86400000)
  const others = c.seasons
    .filter((y) => y !== state.year)
    .map(
      (y) => `<button data-year="${y}" class="flex items-center gap-2 rounded-2xl bg-cyan-900/40 px-4 py-2.5 text-left hover:bg-cyan-900/70">
        <span class="text-lg font-extrabold tabular-nums">${y}</span><span class="text-xs font-bold text-cyan-300">${isClosed(y, c.t) ? '마감' : '집계 중'}</span><span class="text-cyan-300">${ICON.right}</span></button>`,
    )
    .join('')
  const months = Array.from({ length: 12 }, (_, i) => `<span class="${i % 3 === 0 ? '' : 'max-sm:hidden'}">${i + 1}월</span>`).join('')
  return `
    <section class="mb-6 rounded-[28px] bg-strong p-6 text-cyan-50 md:p-8">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="text-sm font-bold text-cyan-300">시즌</p>
          <div class="flex items-center gap-3">
            <span class="text-[clamp(40px,5vw,56px)] leading-none font-extrabold tracking-[-0.04em] tabular-nums">${state.year}</span>
            ${c.closed ? statusPill(state.year, c.t).replace('bg-strong', 'bg-cyan-800') : statusPill(state.year, c.t)}
          </div>
          <p class="mt-3 font-semibold text-cyan-100">${state.year}년에 공개된 MV만 순위에 들어가요.</p>
        </div>
        <div class="flex flex-wrap gap-2">${others}</div>
      </div>
      <div class="mt-6">
        <div class="relative h-3 rounded-full bg-cyan-900">
          <div class="absolute inset-y-0 left-0 rounded-full bg-gradient-to-r from-cyan-500 to-cyan-300" style="width:${pct}%"></div>
          ${c.closed ? '' : `<span class="absolute top-1/2 size-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-4 border-strong bg-cyan-300" style="left:${pct}%"></span>`}
        </div>
        <div class="mt-2 flex justify-between text-xs font-semibold text-cyan-400">${months}</div>
        <p class="mt-3 text-sm font-semibold text-cyan-200">${
          c.closed
            ? `1월 1일 0시 ~ 12월 31일 자정 · 집계를 마친 최종 순위예요`
            : `1월 1일 0시에 시작 · ${md(last)}까지 집계 · 마감까지 ${left}일`
        }</p>
      </div>
    </section>
    <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
      ${periodTabs()}
      ${c.slot && state.period !== 'year' ? stepper(c) : ''}
    </div>`
}

/* ---------- 그리기 ---------- */

function render() {
  const c = ctx()
  document.getElementById('variant-tabs').innerHTML = VARIANTS.map(
    ([name], i) => `<button data-variant="${i}" class="rounded-full px-3 py-1 text-sm font-bold ${i === state.variant ? 'bg-cyan-200 text-strong' : 'text-cyan-200 hover:bg-cyan-900'}">${i + 1}. ${name}</button>`,
  ).join('')
  document.getElementById('scenario-tabs').innerHTML = SCENARIOS.map(
    ([, label], i) => `<button data-scenario="${i}" class="rounded-full px-3 py-1 text-sm font-bold ${i === state.scenario ? 'bg-cyan-200 text-strong' : 'text-cyan-200 hover:bg-cyan-900'}">${label}</button>`,
  ).join('')
  document.getElementById('variant-note').textContent = VARIANTS[state.variant][1]
  document.getElementById('head').innerHTML = [headV1, headV2, headV3][state.variant](c)
  document.getElementById('notice').innerHTML = notices(c)
  document.getElementById('table').innerHTML = table(c)
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) {
    if (state.open) (state.open = null), render()
    return
  }
  const d = b.dataset
  if (d.variant) (state.variant = +d.variant), (state.open = null)
  else if (d.scenario) (state.scenario = +d.scenario), reset()
  else if (d.year) (state.year = +d.year), (state.key = null), (state.open = null)
  else if (d.period) (state.period = d.period), (state.key = null), (state.open = null)
  else if (d.slot) (state.key = d.slot), (state.open = null)
  else if (d.open) state.open = state.open === d.open ? null : d.open
  render()
})
document.addEventListener('keydown', (e) => e.key === 'Escape' && state.open && ((state.open = null), render()))

// 스크린샷용: ?v=1&s=1&p=week&y=2026
const q = new URLSearchParams(location.search)
state.variant = +(q.get('v') ?? 0)
state.scenario = +(q.get('s') ?? 0)
reset()
if (q.get('p')) state.period = q.get('p')
if (q.get('y')) state.year = +q.get('y')
if (q.get('o')) state.open = q.get('o')
render()
</script>
</body>
</html>
