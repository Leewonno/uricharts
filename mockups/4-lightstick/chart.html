<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 4 · 응원봉 — 차트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --night: #15123D; --hall: #211D55; --text: #F2EFFF; --muted: #8E8AC0; --seat: #2E2A68; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--night); color: var(--text); font-family: 'Noto Sans KR', sans-serif; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 4px; }
  .orbit { font-family: 'Orbit', sans-serif; font-variant-numeric: tabular-nums; }

  header { max-width: 1200px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Orbit'; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .logo i { width: 8px; height: 22px; border-radius: 4px 4px 2px 2px; background: #fff; box-shadow: 0 0 12px 3px #b9a8ff; }
  nav { display: flex; gap: 22px; color: var(--muted); }
  nav a[aria-current], nav a:hover { color: var(--text); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 24px 64px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--seat); }
  .tabs button { font-family: 'Orbit'; font-size: 20px; padding: 10px 20px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--text); }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 28px 0 24px; flex-wrap: wrap; }
  h1 { word-spacing: -0.25em; font-family: 'Orbit'; font-weight: 400; font-size: clamp(28px, 4vw, 44px); line-height: 1.2; }
  .head p { color: var(--muted); }
  .step { display: flex; gap: 8px; }
  .step button { padding: 8px 16px; border-radius: 999px; background: var(--hall); font-size: 14px; }

  .rows { display: grid; gap: 4px; }
  .row { display: grid; grid-template-columns: 44px 1fr 120px; gap: 18px; align-items: center; padding: 12px 16px; border-radius: 16px; }
  .row:hover { background: var(--hall); }
  .rank { font-family: 'Orbit'; font-size: 22px; text-align: center; line-height: 1.1; }
  .rank small { display: block; font-family: 'Noto Sans KR'; font-size: 11px; color: var(--muted); }
  .rank small.up { color: #7CF0C5; } .rank small.down { color: #FF8FA3; } .rank small.new { color: #FFE27A; }
  .info { display: grid; gap: 8px; min-width: 0; }
  .info .t { font-weight: 700; font-size: 17px; }
  .info .t span { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 8px; }
  .stick { height: 10px; border-radius: 6px; background: var(--seat); position: relative; }
  .stick i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--c); box-shadow: 0 0 14px 2px var(--c); }
  .stick i::after { content: ''; position: absolute; right: -3px; top: -4px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 16px 6px var(--c); }
  .v { text-align: right; font-family: 'Orbit'; font-size: 18px; line-height: 1.2; }
  .v small { display: block; font-family: 'Noto Sans KR'; font-size: 12px; color: var(--muted); }
  .row.first { background: var(--hall); padding: 22px 16px; margin-bottom: 8px; }
  .row.first .rank { font-size: 34px; }
  .row.first .t { font-size: 22px; }
  .row.first .stick { height: 14px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 24px 40px; }
  @media (max-width: 700px) {
    .row { grid-template-columns: 36px 1fr; }
    .v { grid-column: 2; text-align: left; }
    .info .t span { display: block; margin: 0; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="home.html"><i></i>lightstick chart</a>
  <nav><a href="home.html">홈</a><a href="#" aria-current="page">차트</a><a href="#">소개</a></nav>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-p="week">주간</button>
    <button role="tab" data-p="month">월간</button>
    <button role="tab" data-p="year">연간</button>
  </div>
  <div class="head">
    <div><h1 id="title"></h1><p id="range"></p></div>
    <div class="step"><button>‹ 이전</button><button>다음 ›</button></div>
  </div>
  <div class="rows" id="rows"></div>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, num, short, esc } = KCHART
  let period = new URLSearchParams(location.search).get('p') || 'week'
  const chg = c => c.kind === 'up' ? `▲${c.text}` : c.kind === 'down' ? `▼${c.text}` : c.kind === 'new' ? c.text : ''

  function render() {
    const p = PERIODS[period]
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === period))
    document.getElementById('title').textContent = `${p.label} ${p.name} 차트`
    document.getElementById('range').textContent = `${p.range} · ${p.metric} 기준`
    const rows = ranking(period), max = rows[0].views
    document.getElementById('rows').innerHTML = rows.map(m => `
      <div class="row ${m.rank === 1 ? 'first' : ''}" style="--c:${m.color}">
        <div class="rank">${m.rank}<small class="${m.change.kind}">${chg(m.change)}</small></div>
        <div class="info">
          <div class="t">${esc(m.title)}<span>${esc(m.artist)}</span></div>
          <div class="stick"><i style="width:${Math.max(3, m.views / max * 100)}%"></i></div>
        </div>
        <div class="v">${short(m.views)}<small>${period === 'year' ? `하루 ${short(m.daily)}` : `누적 ${short(m.total)}`}</small></div>
      </div>`).join('')
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { period = b.dataset.p; render() })
  render()
</script>
</body>
</html>
