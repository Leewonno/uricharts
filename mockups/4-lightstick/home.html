<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 4 · 응원봉 — 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #15123D;
    --hall: #211D55;
    --text: #F2EFFF;
    --muted: #8E8AC0;
    --seat: #2E2A68;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--night); color: var(--text); font-family: 'Noto Sans KR', sans-serif; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 4px; }
  .orbit { font-family: 'Orbit', sans-serif; font-variant-numeric: tabular-nums; }

  header { max-width: 1200px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Orbit'; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .logo i { width: 8px; height: 22px; border-radius: 4px 4px 2px 2px; background: #fff; box-shadow: 0 0 12px 3px #b9a8ff; }
  nav { display: flex; gap: 22px; color: var(--muted); }
  nav a[aria-current], nav a:hover { color: var(--text); }

  .hero { max-width: 1200px; margin: 0 auto; padding: 24px 24px 40px; }
  .hero h1 { word-spacing: -0.25em; font-family: 'Orbit'; font-weight: 400; font-size: clamp(30px, 4.4vw, 54px); line-height: 1.25; max-width: 18em; }
  .hero p { color: var(--muted); margin-top: 10px; max-width: 40em; }

  .venue { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }
  .stage-wrap { background: var(--hall); border-radius: 24px; padding: 20px 20px 24px; }
  .stage { height: 26px; width: 46%; margin: 0 auto 18px; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: linear-gradient(#3B357F, #2A2566); color: var(--muted); font-size: 12px; text-align: center; line-height: 22px; }
  .seats { display: grid; grid-template-columns: repeat(50, 1fr); gap: 4px; }
  .seat { aspect-ratio: 1; border-radius: 50%; background: var(--seat); transition: opacity .25s, transform .25s; }
  .seat.on { background: var(--c); box-shadow: 0 0 6px 1px var(--c); }
  .seats.focus .seat.on:not(.hl) { opacity: .15; box-shadow: none; }
  .seats.focus .seat.hl { transform: scale(1.25); }
  @keyframes twinkle { 50% { opacity: .55; } }
  .seat.tw { animation: twinkle 2.4s ease-in-out infinite; animation-delay: var(--d); }
  .caption { color: var(--muted); font-size: 13px; margin-top: 14px; text-align: center; }

  .legend { display: grid; gap: 4px; }
  .legend button { display: grid; grid-template-columns: 26px 14px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border-radius: 12px; }
  .legend button:hover, .legend button:focus-visible { background: var(--hall); }
  .legend .r { font-family: 'Orbit'; color: var(--muted); }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px 2px var(--c); }
  .legend .t { font-weight: 500; line-height: 1.3; }
  .legend .t span { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .legend .v { font-family: 'Orbit'; font-size: 14px; }
  .legend a { display: block; text-align: center; padding: 12px; margin-top: 8px; border: 1px solid var(--seat); border-radius: 12px; }
  .legend a:hover { background: var(--hall); }

  section { max-width: 1200px; margin: 0 auto; padding: 64px 24px; }
  section h2 { font-family: 'Orbit'; font-weight: 400; font-size: 28px; margin-bottom: 18px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--hall); border-radius: 20px; padding: 22px; display: grid; gap: 6px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: var(--c); filter: blur(50px); opacity: .55; }
  .card > * { position: relative; }
  .card b { font-family: 'Orbit'; font-weight: 400; font-size: 24px; }
  .card .p { color: var(--muted); font-size: 14px; }
  .card .w { margin-top: 14px; font-weight: 700; }
  .card .w span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .card:hover { outline: 1px solid var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 24px 40px; }
  @media (max-width: 900px) {
    .venue { grid-template-columns: 1fr; }
    .seats { grid-template-columns: repeat(25, 1fr); }
    .cards { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .seat.tw { animation: none; } .seat { transition: none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="#"><i></i>lightstick chart</a>
  <nav><a href="#" aria-current="page">홈</a><a href="chart.html">차트</a><a href="#">소개</a></nav>
</header>
<main>
  <div class="hero">
    <h1>이번 주 조회수로 1,000석 공연장을 채우면 이렇게 빛나요</h1>
    <p id="lead"></p>
  </div>
  <div class="venue">
    <div class="stage-wrap">
      <div class="stage">STAGE</div>
      <div class="seats" id="seats" role="img" aria-label="주간 조회수 비율로 색칠한 1,000개의 좌석"></div>
      <p class="caption">좌석 1개 = 이번 주 TOP 15 전체 조회수의 0.1%</p>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <section>
    <h2>기간별 차트</h2>
    <div class="cards" id="cards"></div>
  </section>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, short, esc } = KCHART
  const week = ranking('week')
  const total = week.reduce((s, m) => s + m.views, 0)
  document.getElementById('lead').textContent =
    `${PERIODS.week.range}, TOP 15 뮤직비디오가 모은 ${short(total)}회 중 ${week[0].artist}의 ‘${week[0].title}’이 ${Math.round(week[0].views / total * 100)}%를 가져갔어요.`

  // 1000석을 조회수 비율로 배분 (앞줄부터 1위 색으로)
  const SEATS = 1000
  let alloc = week.map(m => Math.floor(m.views / total * SEATS))
  let rest = SEATS - alloc.reduce((a, b) => a + b, 0)
  for (let i = 0; rest > 0; i = (i + 1) % alloc.length, rest--) alloc[i]++
  const seats = []
  week.forEach((m, i) => { for (let k = 0; k < alloc[i]; k++) seats.push(i) })
  document.getElementById('seats').innerHTML = seats.map((i, k) =>
    `<span class="seat on ${k % 7 === 0 ? 'tw' : ''}" data-i="${i}" style="--c:${week[i].color};--d:${(k * 37 % 240) / 100}s"></span>`).join('')

  const legend = document.getElementById('legend')
  legend.innerHTML = week.slice(0, 8).map((m, i) => `
    <button data-i="${i}" style="--c:${m.color}">
      <span class="r">${m.rank}</span><span class="dot"></span>
      <span class="t">${esc(m.title)}<span>${esc(m.artist)}</span></span>
      <span class="v">${short(m.views)}</span>
    </button>`).join('') + `<a href="chart.html">주간 차트 전체 보기</a>`

  const seatsEl = document.getElementById('seats')
  const focus = i => {
    seatsEl.classList.toggle('focus', i != null)
    seatsEl.querySelectorAll('.seat').forEach(s => s.classList.toggle('hl', s.dataset.i === String(i)))
  }
  legend.querySelectorAll('button').forEach(b => {
    b.onmouseenter = b.onfocus = () => focus(b.dataset.i)
    b.onmouseleave = b.onblur = () => focus(null)
  })

  document.getElementById('cards').innerHTML = ['week', 'month', 'year'].map(k => {
    const p = PERIODS[k], r = ranking(k)[0]
    return `<a class="card" href="chart.html?p=${k}" style="--c:${r.color}">
      <b>${p.name}</b><span class="p">${p.label} · ${p.range}</span>
      <div class="w"><span>현재 1위</span>${esc(r.title)} · ${esc(r.artist)}</div></a>`
  }).join('')
</script>
</body>
</html>
