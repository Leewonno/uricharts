<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 · 포토카드 — 차트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root { --lilac: #ECE6FF; --ink: #2B1E5C; --soft: #6E62A3; --card: #FFFFFF; --mint: #2FBF98; --coral: #F0566E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--lilac); color: var(--ink); font-family: 'Gowun Dodum', sans-serif; line-height: 1.55; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  .bri { font-family: 'Bricolage Grotesque', sans-serif; font-variant-numeric: tabular-nums; }

  header { max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 24px; }
  .logo { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
  nav { display: flex; gap: 22px; }
  nav a[aria-current] { border-bottom: 2px solid var(--ink); }

  main { max-width: 1180px; margin: 0 auto; padding: 8px 24px 72px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { padding: 10px 22px; border-radius: 999px; background: var(--card); font-size: 16px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .period { display: flex; align-items: center; gap: 12px; }
  .period button { width: 40px; height: 40px; border-radius: 50%; background: var(--card); }
  .period b { font-family: 'Bricolage Grotesque'; font-size: 18px; }

  h1 { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(36px, 5vw, 56px); letter-spacing: -1px; margin: 36px 0 4px; }
  .desc { color: var(--soft); margin-bottom: 32px; }

  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 24px; align-items: end; margin-bottom: 40px; }
  .pc { background: var(--card); border-radius: 18px; padding: 12px; position: relative; box-shadow: 0 24px 40px -24px rgba(43,30,92,.5); }
  .pc .img { aspect-ratio: 4/3; border-radius: 12px; position: relative; overflow: hidden; }
  .pc .img::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.35), transparent 45%); }
  .pc.holo .img::after { content: ''; position: absolute; inset: 0; background: conic-gradient(from 200deg, #ff9de2, #9be7ff, #c1ffb5, #fff3a1, #ff9de2); mix-blend-mode: soft-light; }
  .pc .meta { padding: 12px 4px 4px; }
  .pc .t { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 22px; line-height: 1.2; }
  .pc .a { color: var(--soft); }
  .pc .v { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 26px; margin-top: 8px; }
  .pc .v small { font-size: 14px; font-weight: 500; color: var(--soft); margin-left: 4px; }
  .sticker { position: absolute; top: -14px; left: -14px; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 24px; z-index: 2; }

  .list { background: var(--card); border-radius: 24px; padding: 8px; }
  .item { display: grid; grid-template-columns: 48px 44px 1fr 150px 70px; gap: 16px; align-items: center; padding: 10px 14px; border-radius: 16px; }
  .item:hover { background: var(--lilac); }
  .item .r { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 22px; text-align: center; }
  .mini { width: 44px; aspect-ratio: 55/85; border-radius: 6px; }
  .item .t { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 17px; }
  .item .a { color: var(--soft); font-size: 14px; }
  .item .v { text-align: right; font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 18px; }
  .chg { text-align: right; font-size: 14px; font-family: 'Bricolage Grotesque'; font-weight: 700; }
  .chg.up { color: var(--mint); } .chg.down { color: var(--coral); } .chg.new { color: var(--ink); } .chg.same, .chg.none { color: #B0A8D6; }

  footer { text-align: center; color: var(--soft); font-size: 13px; padding: 24px 24px 40px; }
  @media (max-width: 860px) {
    .podium { grid-template-columns: 1fr; }
    .podium .pc:nth-child(1) { order: -1; }
    .pc .img { aspect-ratio: 16/9; }
    .item { grid-template-columns: 36px 36px 1fr auto; }
    .item .chg { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="home.html">mvbinder</a>
  <nav><a href="home.html">홈</a><a href="#" aria-current="page">차트</a><a href="#">소개</a></nav>
</header>
<main>
  <div class="top-bar">
    <div class="tabs" role="tablist">
      <button role="tab" data-p="week">주간</button>
      <button role="tab" data-p="month">월간</button>
      <button role="tab" data-p="year">연간</button>
    </div>
    <div class="period"><button aria-label="이전 기간">‹</button><b id="label"></b><button aria-label="다음 기간">›</button></div>
  </div>
  <h1 id="title"></h1>
  <p class="desc" id="desc"></p>
  <div class="podium" id="podium"></div>
  <div class="list" id="list"></div>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, num, short, esc } = KCHART
  let period = new URLSearchParams(location.search).get('p') || 'week'
  const arrow = c => c.kind === 'up' ? '↑' + c.text : c.kind === 'down' ? '↓' + c.text : c.text

  function render() {
    const p = PERIODS[period]
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === period))
    document.getElementById('label').textContent = p.label
    document.getElementById('title').textContent = `${p.name} 뮤직비디오 차트`
    document.getElementById('desc').textContent = period === 'year'
      ? '2025년에 공개된 뮤직비디오를 지금까지의 누적 조회수로 줄 세웠어요.'
      : `${p.range} 사이에 늘어난 조회수로 순위를 매겼어요.`
    const rows = ranking(period)
    const pc = m => `<div class="pc ${m.rank === 1 ? 'holo' : ''}">
      <div class="sticker">${m.rank}</div>
      <div class="img" style="background:${m.color}"></div>
      <div class="meta"><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div>
      <div class="v">${short(m.views)}<small>${p.metric}</small></div></div></div>`
    document.getElementById('podium').innerHTML = pc(rows[1]) + pc(rows[0]) + pc(rows[2])
    document.getElementById('list').innerHTML = rows.slice(3).map(m => `
      <div class="item">
        <div class="r">${m.rank}</div>
        <div class="mini" style="background:${m.color}"></div>
        <div><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div></div>
        <div class="v">${num(m.views)}</div>
        <div class="chg ${m.change.kind}">${arrow(m.change)}</div>
      </div>`).join('')
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { period = b.dataset.p; render() })
  render()
</script>
</body>
</html>
