<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 · 포토카드 — 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --lilac: #ECE6FF;
    --ink: #2B1E5C;
    --soft: #6E62A3;
    --card: #FFFFFF;
    --mint: #2FBF98;
    --coral: #F0566E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { word-break: keep-all; background: var(--lilac); color: var(--ink); font-family: 'Gowun Dodum', sans-serif; line-height: 1.55; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  .bri { font-family: 'Bricolage Grotesque', sans-serif; font-variant-numeric: tabular-nums; }

  header { max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 24px 24px; }
  .logo { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
  .logo span { font-family: 'Gowun Dodum'; font-weight: 400; font-size: 15px; color: var(--soft); margin-left: 8px; }
  nav { display: flex; gap: 22px; font-size: 16px; }
  nav a[aria-current] { border-bottom: 2px solid var(--ink); }

  .hero { max-width: 1180px; margin: 0 auto; padding: 32px 24px 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .hero h1 { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(40px, 5.5vw, 68px); line-height: 1.02; letter-spacing: -1.5px; }
  .hero h1 small { display: block; font-family: 'Gowun Dodum'; font-weight: 400; font-size: 20px; letter-spacing: 0; color: var(--soft); margin-top: 16px; line-height: 1.5; }
  .hero .cta { display: inline-block; margin-top: 28px; background: var(--ink); color: #fff; padding: 14px 26px; border-radius: 999px; font-size: 16px; }

  .fan { position: relative; height: 440px; }
  .pc { position: absolute; width: 220px; aspect-ratio: 55/85; background: var(--card); border-radius: 16px; padding: 10px; box-shadow: 0 20px 40px -18px rgba(43,30,92,.45); display: flex; flex-direction: column; transition: transform .35s ease; }
  .pc .img { flex: 1; border-radius: 10px; position: relative; overflow: hidden; }
  .pc .img::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.35), transparent 45%); }
  .pc .meta { padding: 10px 4px 2px; }
  .pc .t { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 18px; line-height: 1.2; }
  .pc .a { color: var(--soft); font-size: 14px; }
  .pc .v { font-size: 13px; margin-top: 4px; }
  .sticker { position: absolute; top: -12px; left: -12px; width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 22px; z-index: 2; }
  .pc.holo .img::after { content: ''; position: absolute; inset: 0; background: conic-gradient(from 200deg, #ff9de2, #9be7ff, #c1ffb5, #fff3a1, #ff9de2); mix-blend-mode: soft-light; opacity: .9; }
  .fan .pc:nth-child(1) { left: 50%; top: 10px; transform: translateX(-50%) rotate(0deg); z-index: 3; width: 250px; }
  .fan .pc:nth-child(2) { left: 6%; top: 60px; transform: rotate(-10deg); z-index: 2; }
  .fan .pc:nth-child(3) { right: 6%; top: 60px; transform: rotate(9deg); z-index: 1; }
  .fan:hover .pc:nth-child(2) { transform: rotate(-14deg) translateX(-16px); }
  .fan:hover .pc:nth-child(3) { transform: rotate(13deg) translateX(16px); }

  section { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; }
  .sec-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 20px; gap: 12px; }
  .sec-head h2 { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 32px; letter-spacing: -0.5px; }
  .sec-head p { color: var(--soft); }
  .sec-head a { text-decoration: underline; text-underline-offset: 4px; white-space: nowrap; }

  .binder { background: #DCD3FA; border-radius: 28px; padding: 28px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; position: relative; }
  .pocket { background: rgba(255,255,255,.45); border-radius: 14px; padding: 8px; border: 1px solid rgba(255,255,255,.8); }
  .pocket .pc { position: relative; width: 100%; box-shadow: none; }
  .pocket .sticker { width: 36px; height: 36px; font-size: 16px; top: -8px; left: -8px; }

  .switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .switch a { background: var(--card); border-radius: 20px; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; }
  .switch b { font-family: 'Bricolage Grotesque'; font-size: 22px; }
  .switch span { color: var(--soft); font-size: 14px; display: block; }
  .switch a:hover { background: var(--ink); color: #fff; }
  .switch a:hover span { color: #CFC6F5; }

  footer { text-align: center; color: var(--soft); font-size: 13px; padding: 24px 24px 40px; }
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; }
    .fan { height: 380px; }
    .pc { width: 170px; } .fan .pc:nth-child(1) { width: 200px; }
    .binder { grid-template-columns: repeat(2, 1fr); padding: 18px; }
    .switch { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .pc { transition: none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">mvbinder<span>뮤직비디오 조회수 차트</span></a>
  <nav><a href="#" aria-current="page">홈</a><a href="chart.html">차트</a><a href="#">소개</a></nav>
</header>
<main>
  <div class="hero">
    <div>
      <h1>이번 주 가장 많이 본 K-pop 뮤직비디오
        <small id="sub"></small></h1>
      <a class="cta" href="chart.html">주간 차트 펼쳐보기</a>
    </div>
    <div class="fan" id="fan"></div>
  </div>

  <section>
    <div class="sec-head">
      <div><h2>2025년 공개 MV 순위</h2><p>올해 나온 뮤직비디오를 누적 조회수로 모았어요</p></div>
      <a href="chart.html?p=year">연간 차트 전체</a>
    </div>
    <div class="binder" id="binder"></div>
  </section>

  <section>
    <div class="switch">
      <a href="chart.html?p=week"><div><b>주간</b><span>2025년 47주차</span></div>›</a>
      <a href="chart.html?p=month"><div><b>월간</b><span>2025년 10월</span></div>›</a>
      <a href="chart.html?p=year"><div><b>연간</b><span>2025년 공개 MV</span></div>›</a>
    </div>
  </section>
</main>
<footer>유튜브 공개 조회수 기준 · 시안용 예시 수치</footer>
<script src="../data.js"></script>
<script>
  const { ranking, PERIODS, short, esc } = KCHART
  const card = (m, cls = '') => `
    <div class="pc ${cls}">
      <div class="sticker">${m.rank}</div>
      <div class="img" style="background:${m.color}"></div>
      <div class="meta"><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div>
      <div class="v bri">${short(m.views)}회</div></div>
    </div>`
  const week = ranking('week')
  document.getElementById('sub').textContent = `${PERIODS.week.range} 동안 유튜브에서 ${short(week[0].views)}회 재생된 ${week[0].artist}의 ‘${week[0].title}’이 1위예요.`
  document.getElementById('fan').innerHTML = card(week[0], 'holo') + card(week[1]) + card(week[2])
  document.getElementById('binder').innerHTML = ranking('year').slice(0, 10)
    .map(m => `<a class="pocket" href="chart.html?p=year">${card(m, m.rank === 1 ? 'holo' : '')}</a>`).join('')
</script>
</body>
</html>
